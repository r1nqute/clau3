<title>버저비터 라이프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="8살 첫 농구공부터 은퇴 후의 삶까지, 농구선수의 인생을 키우는 텍스트 라이프 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Teko:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: arena-night console — trading-card rail on the left, play-by-play feed + tabs on the right, scorer's-table bar pinned to the bottom */
  --arena:#0b1322;
  --stands:#101c31;
  --panel:#15253f;
  --panel-2:#1b2f4f;
  --line:#284069;
  --chalk:#eef2f8;
  --muted:#93a6c6;
  --dim:#60739a;
  --leather:#ef6620;
  --leather-hi:#ff8c47;
  --led:#ffc443;
  --maple:#d4a66c;
  --maple-dk:#a97a44;
  --good:#45d391;
  --bad:#ff6767;
  --info:#72b6ff;
  --f-disp:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-num:'Teko','Noto Sans KR',system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--arena);color:var(--chalk)}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
  background:
    radial-gradient(1200px 520px at 50% -180px, rgba(255,196,67,.09), transparent 70%),
    radial-gradient(700px 400px at 100% 0, rgba(239,102,32,.06), transparent 70%),
    var(--arena);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--led);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== top bar ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-ball{width:26px;height:26px;flex:none}
.brand b{color:var(--leather-hi);font-weight:400}
.top-right{display:flex;align-items:center;gap:8px}
.chip-led{font-family:var(--f-num);font-size:20px;line-height:1;padding:6px 10px 3px;border-radius:6px;background:#060b14;color:var(--led);border:1px solid #2a2410;text-shadow:0 0 10px rgba(255,196,67,.45);white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:13px}
.settle{border-color:var(--leather);color:var(--leather-hi)}
@media (max-width:420px){.chip-led{display:none}}
.ghost:hover{color:var(--chalk);border-color:var(--muted)}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:120px}
@media (min-width:920px){.grid{grid-template-columns:360px minmax(0,1fr);align-items:start}.rail{position:sticky;top:12px}}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.mainp{min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:919px){.rail{display:contents}.rail .card{order:1}.rail .p-life{order:2}.mainp{order:3}.rail .p-map{order:4}.rail .p-attr{order:5}}

/* ===== trading card ===== */
.card{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.card-top{
  position:relative;overflow:hidden;padding:14px 16px 12px;min-height:118px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 46px, rgba(0,0,0,.10) 46px 47px),
    repeating-linear-gradient(90deg, var(--maple) 0 22px, #c8955a 22px 47px, #d9ae76 47px 70px),
    var(--maple);
  color:#2a1806;
}
.card-top::after{content:"";position:absolute;inset:auto -20% -60px auto;width:220px;height:120px;border:3px solid rgba(255,255,255,.35);border-radius:50%;}
.jersey{position:absolute;right:14px;top:4px;font-family:var(--f-num);font-size:96px;line-height:1;font-weight:600;color:rgba(42,24,6,.82);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.pos-badge{display:inline-block;font-family:var(--f-num);font-size:18px;line-height:1;padding:4px 8px 1px;border-radius:5px;background:#2a1806;color:var(--maple)}
.card-name{font-family:var(--f-disp);font-size:28px;line-height:1.15;margin-top:8px;max-width:62%;word-break:keep-all}
.card-sub{font-size:13px;font-weight:700;opacity:.8}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ovr-row{display:flex;align-items:center;gap:14px}
.ovr{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 30%, var(--leather-hi), var(--leather) 60%, #b84612);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);position:relative;color:#fff}
.ovr::before,.ovr::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ovr::before{border-left:2px solid rgba(0,0,0,.3);border-right:2px solid rgba(0,0,0,.3);inset:0 22px}
.ovr::after{border-top:2px solid rgba(0,0,0,.3);top:50%;height:0}
.ovr span{position:relative;z-index:1;font-family:var(--f-num);font-size:38px;line-height:.8;padding-top:8px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ovr small{display:block;font-family:var(--f-body);font-size:9px;font-weight:900;letter-spacing:.14em;opacity:.9}
.ovr-meta{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;color:var(--muted)}
.ovr-meta strong{color:var(--chalk);font-weight:700}
.stars{color:var(--led);letter-spacing:2px}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--chalk);background:var(--panel-2)}
.trait.neg{border-color:rgba(255,103,103,.45)}

/* ===== panels ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 em{font-style:normal;letter-spacing:0;font-weight:500;text-transform:none;color:var(--dim)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.meter label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter label b{font-family:var(--f-num);font-size:17px;line-height:1;color:var(--chalk);font-weight:500}
.bar{height:6px;border-radius:3px;background:#0b1527;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s ease}
.money-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:13px;color:var(--muted)}
.money-row b{font-family:var(--f-num);font-size:24px;line-height:1;color:var(--led);font-weight:500}

.attrs{display:flex;flex-direction:column;gap:7px}
.attr{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:10px;font-size:13px}
.attr span{color:var(--muted);white-space:nowrap}
.attr .track{position:relative;height:8px;border-radius:4px;background:#0b1527}
.attr .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.attr .track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5;text-decoration:none}
.attr b{font-family:var(--f-num);font-size:19px;line-height:1;text-align:right;font-weight:500}
.t-elite{color:var(--led)} .t-good{color:var(--good)} .t-mid{color:var(--chalk)} .t-low{color:var(--muted)}

/* ===== tabs ===== */
.tabs{display:flex;gap:4px;background:var(--stands);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;font-weight:700;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--leather)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--leather);color:#fff;font-size:11px;line-height:18px}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:2px}
.yr{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid rgba(40,64,105,.55)}
.yr:last-child{border-bottom:0}
.yr-age{font-family:var(--f-num);font-size:30px;line-height:.9;color:var(--chalk)}
.yr-age small{display:block;font-size:15px;color:var(--dim)}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.yr li{position:relative;padding-left:14px;font-size:14px;color:#d5deec;word-break:keep-all;overflow-wrap:anywhere}
.yr li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--dim)}
.yr li.good::before{background:var(--good)} .yr li.bad::before{background:var(--bad)}
.yr li.major{color:var(--chalk);font-weight:700}
.yr li.major::before{background:var(--led);box-shadow:0 0 8px var(--led)}

/* ===== activity cards ===== */
.ap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;transition:transform .12s ease,border-color .12s}
.act:hover:not(:disabled){border-color:var(--leather);transform:translateY(-1px)}
.act:disabled{opacity:.45}
.act strong{font-size:15px}
.act p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:4px;background:#0e1a2e;color:var(--info)}
.act .cost{font-size:12px;color:var(--led)}

/* ===== career ===== */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:8px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.kv b{display:block;font-size:15px;word-break:keep-all}
.kv b.num{font-size:24px;line-height:1.1;font-weight:500}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45}
.btn.warn{border-color:rgba(255,103,103,.5);color:#ffb3b3}
.btn.hot{background:var(--leather);border-color:var(--leather);color:#fff}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(40,64,105,.5)}
th{background:#0e1a2e;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.05em;position:sticky;top:0}
td:nth-child(-n+3),th:nth-child(-n+3){text-align:left}
td.num{font-size:17px}
tr.champ td{background:rgba(255,196,67,.06)}
.award-mini{color:var(--led);font-size:12px}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
.trophy b{font-family:var(--f-num);font-size:20px;line-height:1;color:var(--arena);background:var(--led);border-radius:5px;padding:3px 6px 0;min-width:26px;text-align:center}
.spark{width:100%;height:120px;display:block}
.empty{color:var(--dim);font-size:13.5px;padding:8px 0}

/* ===== relations ===== */
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:10px;padding:10px 12px}
.person .who{min-width:0}
.person .who b{font-size:15px}
.person .who span{font-size:12px;color:var(--muted);margin-left:6px}
.person .bar{max-width:220px}
.person.gone{opacity:.5}
.person .acts-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.person .acts-mini .btn{padding:6px 10px;font-size:12.5px}
@media (max-width:560px){.person{grid-template-columns:1fr}.person .acts-mini{justify-content:flex-start}}

/* ===== bottom bar ===== */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg, rgba(11,19,34,0), rgba(11,19,34,.92) 30%);padding-top:22px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar-inner{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pips{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.pip{width:16px;height:16px;border-radius:50%;background:#0e1a2e;border:1px solid var(--line);flex:none}
.pip.on{background:radial-gradient(circle at 35% 30%, var(--leather-hi), var(--leather));border-color:#b84612}
.next{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:10px 20px 10px 18px;background:var(--leather);color:#fff;box-shadow:0 10px 30px -10px rgba(239,102,32,.7),inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .1s}
.next:hover:not(:disabled){transform:translateY(-1px);background:var(--leather-hi)}
.next:disabled{opacity:.5}
.next .big{display:block;font-family:var(--f-disp);font-size:19px;line-height:1.1}
.next .yr-mini{display:block;font-family:var(--f-num);font-size:16px;line-height:1;opacity:.85;text-align:left}
.next svg{width:22px;height:22px}
.ff{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted)}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;width:min(520px,calc(100% - 32px));background:#0a1220;border:1px solid var(--line);border-left:3px solid var(--leather);border-radius:10px;padding:10px 14px;box-shadow:0 20px 40px -18px #000;transition:all .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-size:14px}
.toast p{margin:2px 0 6px;font-size:13px;color:#cdd7e8}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.deltas i{font-style:normal;font-size:12px;padding:1px 7px;border-radius:4px;background:rgba(69,211,145,.12);color:var(--good);font-weight:700}
.deltas i.neg{background:rgba(255,103,103,.12);color:var(--bad)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:50;display:flex;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,8,15,.72);backdrop-filter:blur(4px);overflow-y:auto}
.sheet{margin:auto;width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -30px #000;animation:pop .22s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.m-kicker{background:#060b14;color:var(--led);font-family:var(--f-num);font-size:19px;line-height:1;padding:10px 18px 6px;letter-spacing:.06em;text-shadow:0 0 10px rgba(255,196,67,.45);border-bottom:1px solid #1d2a40}
.m-in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:25px;line-height:1.2;text-wrap:balance;word-break:keep-all}
.m-body{font-size:15px;color:#d8e0ee;word-break:keep-all;overflow-wrap:anywhere}
.m-body p{margin:0 0 8px}
.m-choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.choice:hover:not(:disabled){border-color:var(--leather);background:#21385d}
.choice:disabled{opacity:.45}
.choice .c-main{min-width:0}
.choice strong{display:block;font-size:15px}
.choice small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.choice .c-tag{flex:none;font-family:var(--f-num);font-size:18px;line-height:1;color:var(--led);padding-top:3px}
.choice.primary{background:var(--leather);border-color:var(--leather);color:#fff;justify-content:center;font-weight:700}
.choice.primary:hover{background:var(--leather-hi)}
.result{background:#0e1a2e;border-radius:10px;padding:12px 14px;border-left:3px solid var(--led)}

/* scoreboard */
.sb{background:#060b14;border:1px solid #1d2a40;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sb-rec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sb-rec .led{font-family:var(--f-num);color:var(--led);font-size:44px;line-height:.85;text-shadow:0 0 14px rgba(255,196,67,.5)}
.sb-rec .led small{font-size:18px;color:#9c7d2e;margin-left:6px}
.sb-res{font-weight:900;font-size:15px;padding:5px 10px;border-radius:6px;background:#1a2438}
.sb-res.win{background:var(--led);color:#1c1300}
.sb-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sb-stats div{background:#0c1424;border-radius:8px;padding:6px 4px 4px;text-align:center}
.sb-stats b{display:block;font-family:var(--f-num);font-size:28px;line-height:.9;color:#ff9a5c;font-weight:500}
.sb-stats span{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sb-awards{display:flex;flex-wrap:wrap;gap:6px}
.sb-awards i{font-style:normal;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,196,67,.14);color:var(--led);border:1px solid rgba(255,196,67,.35)}
.sb-note{font-size:13px;color:var(--muted)}
@media (max-width:440px){.sb-stats b{font-size:23px}.sb-rec .led{font-size:38px}}

/* offers */
.offer .c-main strong{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg-tag{font-size:11px;font-weight:900;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:#0e1a2e;color:var(--info)}
.lg-tag.nba{color:var(--led)}

/* ===== start ===== */
.start{max-width:860px;margin:0 auto;padding-block:28px 60px;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;padding:28px 22px 22px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:
    radial-gradient(circle at 50% 120%, transparent 0 118px, rgba(255,255,255,.12) 119px 121px, transparent 122px),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.1) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
    repeating-linear-gradient(90deg, #c9975c 0 26px, #d3a66d 26px 52px, #c08c51 52px 80px);
  color:#26160a}
.hero h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,9vw,76px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{display:block;font-family:var(--f-num);font-size:.38em;letter-spacing:.32em;color:#6b3d14;margin-bottom:6px}
.hero p{margin:12px 0 0;font-size:15px;font-weight:700;max-width:46ch;color:#3a2410}

function rollGenetics(g){
  const keys=Object.keys(TRAITS),tr=[];
  while(tr.length<2){
    const k=pick(keys);
    if(tr.includes(k))continue;
    if(CONFLICT.some(([a,b])=>(a===k&&tr.includes(b))||(b===k&&tr.includes(a))))continue;
    tr.push(k);
  }
  let pot=Math.round(gauss(70,9));
  if(tr.includes('genius'))pot+=7;
  if(tr.includes('glass'))pot+=5;
  if(tr.includes('fragile'))pot+=3;
  if(tr.includes('lazy'))pot+=6;
  pot=clamp(pot,45,97);
  const h=gauss(g==='f'?175:188,6.5)+(tr.includes('tall')?6:0);
  return {traits:tr,pot,adultHeight:Math.round(h*10)/10};
}

  {id:'highlight',age:[14,24],w:2,cond:s=>isPlaying(s)&&ovr(s)-lvl(s)>=3,title:'하이라이트 영상 대박',body:'누군가 찍어 올린 내 경기 영상이 조회수 50만을 넘었다.',

function bud(s,name){return s.relations.find(r=>r.name===name&&r.bud&&!r.dead);}
function meetBud(s,name,role,bond){let r=bud(s,name);if(!r){r=addRel(s,'친구',name,bond,s.age+(role.includes('1짱')?1:0));r.bud=role;log(s,`${role} ${J(name,'과/와')} 엮이기 시작했다.`,'good');}return r;}
function budBond(s,name,d){const r=bud(s,name);if(r)r.bond=clamp(r.bond+d,0,100);}
function endorseAmt(s){const top=s.team&&LG[s.team.league].mult>=2;return Math.round((s.life.fame*s.life.fame*(top?8:1.6))/100)*100+1000;}
function eligible(s,e){
  if(e.once&&s.flags.used[e.id])return false;
  if(e.age&&(s.age<e.age[0]||s.age>e.age[1]))return false;
  if(e.stages&&!e.stages.includes(s.stage))return false;
  if(e.cond&&!e.cond(s))return false;
  return true;
}
function pickEvents(s,n){
  const pool=EVENTS.filter(e=>eligible(s,e)&&!(s.flags.recent||[]).includes(e.id));const out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((a,e)=>a+e.w,0);let r=rnd()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break;}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  s.flags.recent=[...(s.flags.recent||[]),...out.map(e=>e.id)].slice(-6);
  return out;
}
function eventSpec(s,e){
  if(!eligible(s,e))return null;
  if(e.pre)e.pre(s);
  s.flags.used[e.id]=1;
  return {cat:'event',kicker:`${s.age}세 · ${s.year}`,title:e.title,body:`<p>${typeof e.body==='function'?e.body(s):e.body}</p>`,
    choices:e.choices.filter(c=>!c.cond||c.cond(s)).map(c=>({label:typeof c.t==='function'?c.t(s):c.t,sub:c.sub,act:()=>c.f(s)}))};
}

    else if(r<.88)inj={name:pick(['햄스트링 부분 파열','발목 인대 손상','무릎 연골 손상','손목 골절']),frac:R(.2,.4),sev:2};

    gpFrac-=inj.frac;
    if(inj.sev===3){st(s).injury={ch:0,name:inj.name};s.flags.lastSevInj=s.age;queue.unshift(()=>injuryStoryNow(s));at(s,'athletic',-R(3,6));at(s,'stamina',-R(1,3));s.injury={name:inj.name,carry:R(.2,.45)};lf(s,'mental',-10);}
    else if(inj.sev===2){at(s,'athletic',-R(0,1.5));lf(s,'mental',-4);}

  }
  gpFrac=clamp(gpFrac,0,1);
  const shortF=(s.world&&s.world.short&&s.world.short[lg]===s.year)?.6:1;
  const games=Math.round(L.games*shortF),gp=Math.round(games*gpFrac*R(.93,1));
  const depth=atWC(s)?0:Math.max(0,s.team.str-o);

  const school=L.kind!=='pro';
  const labels=school?['전국대회 우승','준우승','4강','8강','예선 탈락']:lg==='nba'||lg==='wnba'?['파이널 우승','파이널 준우승','컨퍼런스 결승','플레이오프 진출','플레이오프 탈락']:['챔피언결정전 우승','챔피언결정전 준우승','4강 플레이오프','6강 플레이오프','플레이오프 탈락'];

  const sh=L.short,played=gp>=games*.5,isPro=L.kind==='pro';

    w:wins,l:games-wins,res:labels[res],champ,awards:aw.map(a=>a[1]),akeys:aw.map(a=>a[0]),ovr:o,injury:injury?.name||null,salary:paid};
  s.seasons.push(season);
  aw.forEach(a=>s.awards.push({year:s.year,age:s.age,key:a[0],name:a[1],lg}));
  const line=`${s.team.name} · ${wins}승 ${games-wins}패 · ${labels[res]} · 평균 ${season.pts}점 ${season.reb}리바 ${season.ast}어시`;
  log(s,line,champ?'major':res>=4?'':'good');
  if(fate!==1)log(s,fate>1?pick(['억빠 시즌: 던지는 족족 들어갔다. 해설진이 "설명할 수 없다"를 반복했다.','억빠 시즌: 상대 수비가 왜인지 자꾸 비켜 줬다.']):pick(['억까 시즌: 림이 나만 싫어하는 것 같았다.','억까 시즌: 슛이 들어가도 왜인지 기록이 안 됐다.']),fate>1?'good':'bad');

function bmOffense(s,M){

const BM_SEQ=['D','O','D','O','D','O'];

      if(chance(interest*.5)){of.salary=Math.round(of.salary*1.35/100)*100;lf(s,'mental',3);return {text:`단장이 한참 고민하더니 손을 내밀었다. ${fmtMoney(of.salary)}.`,next:negotiateSpec(s,of,offers,why)};}
      if(chance(.6)){withdraw();return {text:'"시간 낭비였군요." 제안이 철회됐다.',next:faSpec(s,why,offers)};}

  else{
    ch.push({label:same?'트레이드 요청서 제출':'이적 협상 시작',sub:same?'현재 계약 그대로 팀만 옮긴다':`${fee?`바이아웃 ${fmtMoney(fee)} · `:''}새 계약 ${fmtMoney(sal)} × ${yrs}년`,tag:`${Math.round(p*100)}%`,act:()=>attempt(0)});
    ch.push({label:'언론에 공개적으로 이적 의사 표명',sub:'압박으로 확률 상승. 대신 현 소속팀 팬과 동료가 등을 돌린다',tag:`${Math.round(clamp(p+.15,.03,.92)*100)}%`,
      act:()=>{lf(s,'fame',-4);bondTeam(s,-10);return attempt(.15);}});
    if(s.money>=3000)ch.push({label:'상대 구단 단장과 비밀 식사',sub:'3,000만 원 · 확률 소폭 상승',tag:`${Math.round(clamp(p+.08,.03,.92)*100)}%`,act:()=>{s.money-=3000;return attempt(.08);}});
  }
  ch.push({label:'← 다른 팀 보기',act:()=>({spec:teamListSpec(s,lg)})});
  return {kicker:`이적 시장 · ${LG[lg].name}`,title:t.name,
    body:`<div class="kv" style="margin-bottom:10px"><div><span>팀 전력</span><b>${starStr(teamStars(t.str,lg))}</b></div><div><span>예상 역할</span><b>${roleLabel(o,t.str)}</b></div><div><span>성공 확률</span><b class="num">${Math.round(p*100)}%</b></div><div><span>${same?'연봉 (유지)':'제시 예상 연봉'}</span><b class="num">${fmtMoney(sal)}</b></div></div>
      <div class="roster">${ros.map(r=>`<div><span>${esc(r.name)}${r.real?'<i class="real">REAL</i>':''}<small>${r.pos} · ${r.age}세</small></span><b class="${tierCls(r.o)}">${r.o}</b></div>`).join('')}</div>`,
    choices:ch};
}

/* ================= living world: real-player moves & news ================= */
function W(){return S&&S.world;}
function allPlayers(){const w=W();return w&&w.added&&w.added.length?PLAYERS.concat(w.added):PLAYERS;}
function pTeam(p){const w=W(),m=w&&w.mv&&w.mv[p.n];return m?m.t:p.t;}
function pLg(p){const w=W(),m=w&&w.mv&&w.mv[p.n];return m?m.lg:p.lg;}
const isKR=p=>!p.n.includes(' ');
function worldInit(s){if(!s.world)s.world={mv:{},adj:{},ret:{},added:[],news:[],extra:{},salMul:{},short:{},once:{},unread:0};return s.world;}
function applyWorld(s){for(const lg in TEAMS_BASE)TEAMS[lg]=TEAMS_BASE[lg].concat((s&&s.world&&s.world.extra&&s.world.extra[lg])||[]);}
function wpick(pairs){const tot=pairs.reduce((a,x)=>a+x[1],0);if(tot<=0)return null;let r=rnd()*tot;for(const [v,w] of pairs){r-=w;if(r<=0)return v;}return pairs[pairs.length-1][0];}
function addNews(s,yr,tag,h,b,big,eff){
  const w=worldInit(s);w.news.push({yr,tag,h,b,big:!!big,eff:eff||''});
  if(w.news.length>250)w.news.splice(0,w.news.length-250);
  w.unread=(w.unread||0)+1;
  if(big)log(s,`[속보] ${h}`,'major');
}
function teamPower(lg,t,yr,g){const r=roster(lg,t,yr,g);return r.slice(0,3).reduce((a,p)=>a+p.o,0)/3;}
const WORLD_EVENTS=[
  {id:'crash',p:.045,run:s=>{const pt=port(s);let loss=0;['stock','etf','coin'].forEach(k=>{if(pt[k]){const nv=Math.round(pt[k]*R(.5,.7));loss+=pt[k]-nv;pt[k]=nv;}});if(pt.gold)pt.gold=Math.round(pt.gold*1.15);
    let el=0;s.assets.forEach(a=>{if(a.cat==='estate'||a.id==='apt'){const nv=Math.round(a.value*.85);el+=a.value-nv;a.value=nv;}});
    return {tag:'경제',h:'글로벌 금융위기 발생, 증시 폭락',b:'미국발 신용 경색이 세계 증시를 덮쳤다. 코스피와 나스닥이 하루 만에 10% 넘게 빠졌고 부동산 시장도 얼어붙었다. 금값만 치솟았다.',
      eff:loss||el?`내 자산 영향: 주식·ETF·코인 ${sgn(-loss)} · 부동산 평가액 ${sgn(-el)}`:'내 자산 영향: 없음 (투자·부동산 미보유)'};}},
  {id:'coinboom',p:.04,run:s=>{const pt=port(s);let g=0;if(pt.coin){const nv=Math.round(pt.coin*R(2,3.5));g=nv-pt.coin;pt.coin=nv;}
    return {tag:'경제',h:'비트코인 사상 최고가, 암호화폐 광풍',b:'현물 ETF 자금이 몰리며 암호화폐가 1년 만에 세 배가 됐다. 동료 선수들 단톡방도 코인 이야기뿐이다.',eff:g?`내 암호화폐 ${sgn(g)}`:'암호화폐를 갖고 있었다면…'};}},
  {id:'estateboom',p:.05,run:s=>{let g=0;s.assets.forEach(a=>{if(a.cat==='estate'||a.id==='apt'){const nv=Math.round(a.value*1.22);g+=nv-a.value;a.value=nv;if(a.income)a.income=Math.round(a.income*1.1);}});
    return {tag:'경제',h:'부동산 대폭등, 서울 아파트값 사상 최고',b:'금리 인하와 공급 부족이 겹치며 집값이 1년 새 20% 넘게 뛰었다. 임대료도 따라 올랐다.',eff:g?`내 부동산 평가액 ${sgn(g)} · 임대료 +10%`:'내 부동산: 없음'};}},
  {id:'expansion',once:1,p:.3,cond:(s,yr)=>s.gender==='m'&&yr>=2027,run:s=>{const w=worldInit(s);w.extra.nba=(w.extra.nba||[]).concat(['시애틀 슈퍼소닉스','라스베이거스 확장 구단']);applyWorld(s);
    return {tag:'리그',h:'NBA, 시애틀·라스베이거스 2개 구단 확장 확정',b:'시애틀에 슈퍼소닉스가 돌아오고 라스베이거스에 새 구단이 생긴다. 리그는 32개 팀 체제가 됐다. 로스터 자리가 늘어 해외 선수에게도 기회가 넓어진다.',eff:'NBA 팀 30개 → 32개'};}},
  {id:'tvdeal',once:1,p:.25,cond:(s,yr)=>yr>=2027,run:s=>{const w=worldInit(s);const lg=s.gender==='m'?'nba':'wnba';w.salMul[lg]=lg==='nba'?1.3:2.2;
    return {tag:'리그',h:lg==='nba'?'NBA 역대급 중계권 계약, 샐러리캡 30% 폭등':'WNBA 새 노사협약 타결, 선수 연봉 두 배 이상 인상',b:lg==='nba'?'새 미디어 계약으로 리그 수입이 크게 늘었다. 모든 구단의 지갑이 두꺼워졌다.':'수년간의 협상 끝에 연봉 체계가 전면 개편됐다. 최고 연봉이 처음으로 수억 원대를 넘는다.',eff:`앞으로 ${LG[lg].name} 계약 연봉 ×${w.salMul[lg]}`};}},
  {id:'lockout',p:.03,cond:s=>s.stage==='pro'&&s.team&&!ABROAD[s.team.league]&&s.team.league!=='sangmu',run:(s,yr)=>{const w=worldInit(s);const lg=s.team.league;w.short[lg]=yr+1;
    return {tag:'리그',h:`${LG[lg].name} 노사 갈등, 다음 시즌 단축 운영`,b:'구단과 선수협의 협상이 결렬되며 개막이 두 달 넘게 밀렸다. 다음 시즌은 경기 수가 크게 줄어든다.',eff:'다음 시즌 경기 수·연봉 40% 감소'};}},
  {id:'boom',once:1,p:.15,cond:s=>s.flags.nat||s.legacy>=120,run:s=>{lf(s,'fame',6);return {tag:'사회',h:'"농구 다시 뜬다" 국내 농구 붐',b:'대표팀 선전과 스타 선수들의 활약에 체육관마다 매진 행렬이다. 유소년 농구 교실 등록도 두 배로 늘었다.',eff:'인기 +6'};}},
];
function worldYear(s,yr){
  const w=worldInit(s),g=s.gender,ny=yr+1;
  const lgs=g==='m'?['kbl','nba','bleague']:['wkbl','wnba','wleague'];
  const bigs=[];
  const big=(tag,h,b,eff)=>{addNews(s,yr,tag,h,b,true,eff);bigs.push({tag,h,b,eff});};
  // development & retirement
  allPlayers().forEach(p=>{
    if(!lgs.includes(pLg(p))||w.ret[p.n])return;
    w.adj[p.n]=clamp((w.adj[p.n]||0)+R(-1.3,1.3),-7,7);
    if(!rActive(p,ny)&&ny-p.b>=18){
      w.ret[p.n]=yr;const L=LG[pLg(p)],intl=L.level>=76;const legend=p.o>=L.level+(intl?11:12)||(ny-p.b>=37&&p.o>=L.level+9);
      if(legend)big('은퇴',`레전드 ${p.n}, 현역 은퇴 선언`,`${pTeam(p)}의 ${p.n}(${ny-p.b}세)이 유니폼을 벗는다. 한 시대가 저물었다. 영구결번 논의가 시작됐다.`);
      else addNews(s,yr,'은퇴',`${p.n} 은퇴`,`${pTeam(p)}의 ${J(p.n,'이/가')} ${ny-p.b}세에 은퇴를 발표했다.`);
    }
  });
  // trades & FA moves, driven by team strength and age
  lgs.forEach(lg=>{
    const L=LG[lg],teams=TEAMS[lg];if(!teams||teams.length<2)return;
    const n={nba:RI(3,6),kbl:RI(1,3),bleague:RI(0,2),wnba:RI(1,3),wkbl:RI(0,2),wleague:RI(0,1)}[lg];
    const power={};teams.forEach(t=>power[t]=teamPower(lg,t,ny,g));
    const sorted=teams.slice().sort((a,b)=>power[b]-power[a]),k=Math.ceil(teams.length/3);
    const contenders=sorted.slice(0,k),weak=sorted.slice(-k);
    for(let i=0;i<n;i++){
      const cands=allPlayers().filter(p=>pLg(p)===lg&&!w.ret[p.n]&&rActive(p,ny)&&!(w.movedYr&&w.movedYr[p.n]>=yr-2));
      const p=wpick(cands.map(p=>{const t=pTeam(p),age=ny-p.b,o=rOvr(p,ny);let wt=1;if(weak.includes(t))wt+=2;if(age>=30)wt+=1.5;if(o>=L.level+10&&!(age>=29&&weak.includes(t)))wt*=.35;if(age<=25)wt*=.3;if(contenders.includes(t)&&age<30)wt*=.5;return [p,wt];}));
      if(!p)break;
      const from=pTeam(p),o=rOvr(p,ny),age=ny-p.b;
      const pool=(weak.includes(from)&&age>=27?contenders:teams).filter(t=>t!==from);if(!pool.length)continue;
      const to=pick(pool);
      w.mv[p.n]={t:to,lg};w.movedYr=w.movedYr||{};w.movedYr[p.n]=yr;
      const intl=lg==='nba'||lg==='wnba';
      const kind=intl?(chance(.65)?'트레이드':'FA 이적'):(chance(.7)?'FA 이적':'트레이드');
      const why=contenders.includes(to)&&weak.includes(from)?`우승을 노리는 ${to}의 승부수다.`:age<=25?`${J(to,"이/가")} 미래를 보고 베팅했다.`:'리빌딩과 전력 보강의 이해가 맞았다.';
      const body=`${J(p.n,'이/가')} ${to} 유니폼을 입는다. (${age}세 · OVR ${o}) ${why}`;
      if(o>=L.level+(intl?10:9))big(kind,`[${L.short}] 초대형 ${kind}! ${p.n}, ${from} → ${to}`,body);
      else addNews(s,yr,kind,`[${L.short}] ${p.n}: ${from} → ${to}`,body);
    }
  });
  // Korean players heading abroad
  const top=g==='m'?'nba':'wnba';
  allPlayers().filter(p=>isKR(p)&&!w.ret[p.n]&&lgs.includes(pLg(p))&&pLg(p)!==top&&rActive(p,ny)).forEach(p=>{
    const o=rOvr(p,ny);if(o>=LG[top].level&&chance(.2)){const to=pick(TEAMS[top]),from=pTeam(p);w.mv[p.n]={t:to,lg:top};
      big('해외 진출',`${p.n}, ${LG[top].name} 진출! ${J(to,'과/와')} 계약`,`${from}에서 뛰던 ${J(p.n,'이/가')} 꿈의 무대에 선다. 한국 농구 역사에 남을 계약이다.`);}
  });
  // drafts: #1 picks join the world
  lgs.filter(lg=>['nba','kbl','wnba','wkbl'].includes(lg)).forEach(lg=>{
    const L=LG[lg],intl=lg==='nba'||lg==='wnba';
    let name;let guard=0;do{name=intl?pick(EN_F[g])+' '+pick(EN_L):koName(g);}while(allPlayers().some(p=>p.n===name)&&guard++<20);
    const gen=chance(.12),o=Math.round(L.level-(gen?1:7)+R(-2,3)),t=pick(TEAMS[lg]),b=ny-RI(19,22);
    w.added.push({n:name,pos:pick(['PG','SG','SF','PF','C']),b,o,y0:ny,lg,t,gen:true});
    if(gen)big('드래프트',`[${L.short}] "세대급 재능" ${name}, ${ny} 드래프트 1순위로 ${t}행`,`스카우트들이 입을 모아 "10년에 한 번 나올 선수"라고 평가한다. 벌써부터 MVP 후보로 거론된다.`);
    else addNews(s,yr,'드래프트',`[${L.short}] ${ny} 드래프트 1순위: ${name} → ${t}`,`${ny-b}세 ${J(name,'이/가')} 전체 1순위로 ${t}에 지명됐다.`);
  });
  if(w.added.length>80)w.added=w.added.filter(p=>!w.ret[p.n]).slice(-80);
  // champions & MVP of the top leagues
  lgs.filter(lg=>['nba','kbl','wnba','wkbl'].includes(lg)).forEach(lg=>{
    const L=LG[lg],teams=TEAMS[lg];
    const se=s.seasons.find(x=>x.year===yr&&x.lg===lg);
    const champ=se&&se.champ?se.team:wpick(teams.filter(t=>!se||t!==se.team).map(t=>[t,Math.pow(Math.max(1,teamPower(lg,t,yr,g)-L.level+12),2)]));
    const myMvp=s.awards.some(a=>a.year===yr&&a.lg===lg&&a.key==='mvp');
    const best=allPlayers().filter(p=>pLg(p)===lg&&rActive(p,yr)&&!w.ret[p.n]).map(p=>[p,rOvr(p,yr)+R(0,4)]).sort((a,b)=>b[1]-a[1])[0];
    const mvp=myMvp?s.name:best?best[0].n:'—';
    addNews(s,yr,'시즌',`[${L.short}] ${seasonLabel({team:{league:lg}},yr)} 시즌 챔피언 ${champ}, MVP ${mvp}`,`${J(champ,'이/가')} 정상에 올랐다. 정규리그 MVP는 ${mvp}.`);
    if(best&&!myMvp){w.mvps=w.mvps||{};w.mvps[best[0].n]=(w.mvps[best[0].n]||0)+1;if(w.mvps[best[0].n]===3)big('기록',`${best[0].n}, 통산 3번째 ${L.short} MVP`,`역대 손꼽히는 선수 반열에 올랐다. 명예의 전당 입성은 시간문제다.`);}
  });
  // big world events (at most one a year)
  for(const ev of WORLD_EVENTS.filter(e=>!(e.once&&w.once[e.id])&&(!e.cond||e.cond(s,yr))).sort(()=>rnd()-.5)){
    if(chance(ev.p)){if(ev.once)w.once[ev.id]=1;const r=ev.run(s,yr);if(r)big(r.tag,r.h,r.b,r.eff);break;}
  }
  syncMates(s);
  const PRI={경제:0,리그:0,사회:0,'해외 진출':1,드래프트:2,기록:3,트레이드:4,'FA 이적':4,은퇴:5};
  bigs.sort((a,b)=>(PRI[a.tag]??9)-(PRI[b.tag]??9));
  bigs.slice(0,2).forEach(n=>enqueue(()=>({cat:'news',cls:'news',kicker:`속보 · ${n.tag} · ${yr}`,title:n.h,body:`<p>${esc(n.b)}</p>${n.eff?`<div class="result">${esc(n.eff)}</div>`:''}`,choices:[{label:'계속',primary:true,act:()=>null}]})));
  if(bigs.length>2)log(s,`그 밖에도 큰 소식 ${bigs.length-2}건이 뉴스 탭에 있다.`);
}
function syncMates(s){
  if(!s.team||!LG[s.team.league]||LG[s.team.league].kind==='school'||s.team.league==='sangmu')return;
  const ros=roster(s.team.league,s.team.name,s.year,s.gender).filter(p=>p.wp);
  const names=new Set(ros.map(p=>p.name));
  s.relations.filter(r=>r.type==='팀 동료'&&!names.has(r.name)).forEach(r=>{r.gone=true;const p=allPlayers().find(x=>x.n===r.name);log(s,`팀 동료 ${J(r.name,'이/가')} ${p&&!W().ret[p.n]?pTeam(p)+'(으)로 떠났다.':'팀을 떠났다.'}`);});
  s.relations=s.relations.filter(r=>!r.gone);
  const have=new Set(s.relations.filter(r=>r.type==='팀 동료').map(r=>r.name));
  ros.filter(p=>!have.has(p.name)).slice(0,Math.max(0,3-have.size)).forEach(p=>{const r=addRel(s,'팀 동료',p.name,35,p.age);r.real=true;log(s,`${J(p.name,'이/가')} 우리 팀에 합류했다.`,'good');});
}
function newsHTML(s){
  const w=worldInit(s);w.unread=0;
  const list=w.news.slice().reverse();
  const tags=['전체',...new Set(list.map(n=>n.tag))];const f=UI.ntag||'전체';
  return list.length?`<nav class="subtabs" style="margin-top:0">${tags.map(t=>`<button class="chipb" data-ntag="${t}" aria-pressed="${f===t}">${t}</button>`).join('')}</nav>
    <div class="news-list">${list.filter(n=>f==='전체'||n.tag===f).slice(0,120).map(n=>`<article class="newsitem ${n.big?'big':''}"><div class="news-meta"><span class="ntag">${esc(n.tag)}</span><span class="num">${n.yr}</span>${n.big?'<span class="nbig">속보</span>':''}</div><h4>${esc(n.h)}</h4><p>${esc(n.b)}</p>${n.eff?`<p class="neff">${esc(n.eff)}</p>`:''}</article>`).join('')}</div>`
    :'<div class="empty">아직 뉴스가 없다. 첫 시즌이 끝나면 이적 소식과 리그 결과가 들어온다.</div>';
}

/* ================= year flow ================= */
let queue=[];
function enqueue(fn){queue.push(fn);}
function ageUp(quiet){
  if(UI.modalOpen||!S||!S.alive)return;
  const s=S;queue=[];
  if(s.routine?.on&&s.ap>0)runRoutine(s,!quiet&&!UI.skip);
  else if(UI.skip&&s.ap>0)runRoutine(s,false,skipSlots(s));

  if(!quiet){
    const n=s.stage==='pro'?(chance(.55)?2:1):s.age<12?(chance(.6)?1:0):(chance(.3)?2:1);
    if(SET.events!=='off')pickEvents(s,n).forEach(e=>enqueue(()=>eventSpec(s,e)));
  }
  if(isPlaying(s)&&!s.flags.banned){
    if(!quiet&&s.age>=13&&(s.stage!=='middle'||chance(.6)))enqueue(()=>isPlaying(s)?bigMatchIntro(s):null);
    else if(!quiet&&s.age>=10&&chance(.45))enqueue(()=>isPlaying(s)?seasonClutch(s):null);
    enqueue(()=>isPlaying(s)?seasonSpec(s):null);
  }
  enqueue(()=>{yearEnd(s,yr);return null;});

}
function yearEnd(s,yr){
  const o0=ovr(s);
  // national team status (evaluated on finished season)

  if(s.age>=19&&['college','pro'].includes(s.stage)&&o0>=cut&&!s.flags.banned){if(!s.flags.nat){s.flags.nat=true;lf(s,'fame',5);log(s,'성인 국가대표에 처음 발탁됐다.','major');}}
  else if(s.flags.nat&&(o0<cut-3||!isPlaying(s)))s.flags.nat=false;
  nationalSpecs(s,yr).forEach(f=>enqueue(f));
  // age
  s.age++;s.year++;
  const prevH=s.height;
  s.height=+Math.max(s.height,s.adultHeight*gfrac(s.age)).toFixed(1);
  if(s.age<=19&&s.height-prevH>=4)log(s,`키가 ${(s.height-prevH).toFixed(1)}cm 컸다. 이제 ${s.height.toFixed(1)}cm.`,'good');
  // natural development
  const a=s.age;
  for(const k of ATTRS){
    const c=cap(s,k),v=s.attr[k];let d=0;
    if(v<c){d=(c-v)*(a<13?.05:a<19?.07:a<23?.05:a<28?.022:0);if(has(s,'genius'))d*=1.3;if(atWC(s))d*=1.7;else if(s.flags.wc&&a<=24&&s.team&&(s.team.league==='nba'||s.team.league==='wnba'))d*=1.5;}
    if(a>=30){const dec={athletic:1.6,stamina:1.3,inside:.6,rebound:.7,defense:.8,handle:.5,shoot:.2,pass:.1,iq:-.4}[k]*(1+(a-30)*.18);d-=dec*R(.6,1.3);}
    if(s.stage==='army')d-=R(1,2.5);
    s.attr[k]=clamp(v+d*R(.7,1.25),1,maxFor(s,k));
  }
  // life drift
  const maxH=clamp(100-Math.max(0,a-40)*.9,20,100);
  s.life.health=clamp(s.life.health+(a<30?14:a<50?8:a<70?3:0),0,maxH);
  if(a>=60)s.life.health=clamp(s.life.health-R(1,4)*(1+(a-60)/15),0,100);
  s.life.happy+=(58-s.life.happy)*.15;
  s.life.mental+=(55-s.life.mental)*.1;
  s.life.fame*=isPlaying(s)?.93:.9;
  if(s.age<23&&isPlaying(s)&&s.stage!=='pro')s.life.smarts=clamp(s.life.smarts-1,0,100);
  // money
  if(s.age===19&&!s.flags.gotSeed){s.flags.gotSeed=1;if(has(s,'rich')){s.money+=5000;log(s,'성인이 되자 부모님이 통장을 건네주셨다. 5,000만 원.');}}
  if(s.age<19)s.flags.famBudget=Math.min((s.flags.famBudget||0)+(has(s,'rich')?3000:600),has(s,'rich')?9000:1500);
  if(s.age>=20){const living=Math.round(1500+Math.max(0,s.contract?.salary||s.career2?.income||0)*.12);s.money-=living;}
  if(s.flags.endorse){if(s.life.fame<25||s.stage!=='pro'){log(s,'광고 계약이 종료됐다.');s.flags.endorse=0;}else{s.money+=s.flags.endorse;}}
  financeYear(s);
  if(atWC(s)&&isPlaying(s)){lf(s,'fame',6);log(s,`${s.team.name}: 월드클래스 코칭. 오늘도 NBA 스카우트가 연습을 지켜봤다.`,'good');}
  if((s.stage==='retired'||s.stage==='civil')&&s.career2&&a<66){
    let inc=s.career2.income;if(s.career2.risky)inc=Math.round(inc*R(.3,1.8));
    if(s.career2.id==='creator')s.career2.income=Math.round(Math.max(1500,s.life.fame*s.life.fame*2));
    s.money+=inc;
    if(s.flags.headCoach&&chance(clamp((s.attr.iq-55)*.012+.06,.03,.3))){s.awards.push({year:s.year-1,age:a-1,key:'coach_champ',name:`${s.year-1} 감독 우승`,lg:'coach'});s.legacy+=8;lf(s,'fame',6);lf(s,'happy',10);log(s,'감독으로서 챔피언결정전 우승을 차지했다!','major');}
  }
  if(s.career2?.id==='politician'&&a>=s.career2.term){log(s,`${s.career2.title} 임기를 마쳤다.`,'good');s.career2=s.career2.prev||{id:'normal',title:'평범한 직장인',income:4500};}
  if(a===66&&s.career2){log(s,'일에서 은퇴했다. 이제는 쉬어도 된다.');}
  if(a>=66)s.money+=Math.round(1200+(s.flags.pensionBonus||0));
  // relations
  s.flags.relDone={};
  s.relations.forEach(r=>{if(r.dead)return;r.age++;r.bond=clamp(r.bond-(r.type==='라이벌'?1:2),0,100);
    if(r.type==='아버지'||r.type==='어머니'){if(r.age>=68&&chance(.012*Math.exp((r.age-68)/6))){r.dead=true;lf(s,'happy',-22);lf(s,'mental',-10);log(s,`${r.type} ${J(r.name,'이/가')} 세상을 떠나셨다. 향년 ${r.age}세.`,'bad');}}
    if(r.type==='반려견'&&r.age>=12&&chance(.25)){r.dead=true;lf(s,'happy',-15);log(s,`반려견 ${J(r.name,'이/가')} 무지개다리를 건넜다. ${r.age}살.`,'bad');}
    if(r.type==='연인'&&r.bond<25&&chance(.45)){r.dead=true;r.gone=true;lf(s,'happy',-10);log(s,`${J(r.name,'과/와')} 헤어졌다.`,'bad');}
  });
  s.relations=s.relations.filter(r=>!(r.gone));
  s.relations.filter(r=>r.type==='팀 동료'&&r.real).forEach(r=>{const p=allPlayers().find(x=>x.n===r.name);if(p&&!rActive(p,s.year)){r.gone=true;log(s,`팀 동료 ${J(r.name,'이/가')} 은퇴했다.`);}});
  s.relations=s.relations.filter(r=>!(r.gone));
  // injuries carry handled in sim; growth spurts
  s.ovrHist.push({age:a,o:ovr(s)});
  // stage AP
  s.apMax=AP_BY[s.stage]||3;s.ap=s.apMax;s.flags.yearly={};
  if(s.life.happy<15&&!s.flags.lowWarned){s.flags.lowWarned=1;log(s,'요즘 아무것도 즐겁지 않다. 쉬어야 할 때다.','bad');}
  if(s.life.happy>30)s.flags.lowWarned=0;
  // banned
  if(s.flags.banned&&s.stage==='pro'){retire(s);enqueue(()=>career2Spec(s,false));}
  // transitions
  try{worldYear(s,yr);}catch(e){console.error(e);}
  transitions(s);
  // HOF

  if(s.stage==='high'&&a===19){enqueue(()=>crossroadSpec(s));return;}

  if(ij.ch===1){ij.ch=2;return [()=>chap(s,'재활 일지',2,3,'재활 9개월 차','고정 자전거, 밴드, 다시 고정 자전거. 거울 속 다리가 반대쪽보다 눈에 띄게 가늘다. 팀은 내 없이도 이기고 있다.',[
    {label:'조기 복귀를 요청한다',sub:'바로 뛴다 · 위험',act:()=>{if(s.injury)s.injury.carry=0;lf(s,'health',-8);if(ij.risky||chance(.3)){at(s,'athletic',-2);lf(s,'mental',-4);return '복귀 2주 만에 다시 통증이 왔다. 조금 더 기다렸어야 했다.';}return '감독이 고개를 끄덕였다. 코트 냄새가 반가웠다.';}},
    {label:'완벽해질 때까지 기다린다',sub:'운동능력 회복',act:()=>{at(s,'athletic',2.5);lf(s,'mental',3);if(s.injury)s.injury.carry=Math.min(.5,s.injury.carry+.05);return '한 달을 더 버텼다. 점프할 때 더는 무섭지 않다.';}},
    {label:'스포츠 심리 상담을 받는다',sub:'멘탈 +12',act:()=>{lf(s,'mental',12);return '"다시 다칠까 봐 무서운 건 당연한 겁니다." 그 말에 처음으로 울었다.';}}])];}
  if(ij.ch===2&&!s.injury&&isPlaying(s)){ij.ch=3;return [()=>chap(s,'재활 일지',3,3,'복귀전','장내 아나운서가 내 이름을 부르자 관중석이 일어섰다. 1년 넘게 기다린 박수다.',[
    {label:'첫 슛을 던진다',sub:`슈팅 ${Math.round(s.attr.shoot)}`,act:()=>{if(chance(clamp(.4+(s.attr.shoot-60)*.01,.2,.8))){lf(s,'fame',5);lf(s,'mental',10);st(s).comeback=true;log(s,'부상을 딛고 복귀전에서 첫 득점.','major');return '그물이 출렁였다. 벤치의 동료들이 전부 코트로 뛰어나올 뻔했다.';}lf(s,'mental',2);return '빗나갔다. 그래도 박수는 멈추지 않았다.';}},
    {label:'수비부터 한다',sub:'팀 플레이',act:()=>{bondTeam(s,8);lf(s,'mental',6);st(s).comeback=true;return '첫 수비에서 몸을 날려 공을 걷어냈다. 그걸로 충분했다.';}}])];}
  return [];
}

function rivalStory(s){
  const r=rivalRel(s);if(!r)return [];
  const rv=st(s).rival||(st(s).rival={ch:0,d:RI(-4,4)});
  const rO=()=>ovr(s)+rv.d+(s.age>30?RI(-2,2):0);
  const A=`라이벌 ${r.name}`,out=[];
  if(rv.ch===0&&s.stage==='high'&&s.age>=17){rv.ch=1;out.push(()=>chap(s,A,1,4,'고교 최강자전',`전국대회 결승. 상대 에이스는 ${r.name}. 3년 전의 그 말, "다음엔 더 세게 해 와"가 아직 귀에 남아 있다.`,[
    {label:'1대1로 정면 승부',sub:'내 실력으로',act:()=>{if(chance(clamp(.5+(ovr(s)-rO())*.04,.15,.85))){rv.w=(rv.w||0)+1;lf(s,'fame',5);lf(s,'mental',5);r.bond=clamp(r.bond+5,0,100);return `${r.name}의 마지막 슛을 블록했다. 경기 후 그가 먼저 손을 내밀었다.`;}lf(s,'mental',-4);boostAll(s,.6);return `${r.name}에게 결승 득점을 내줬다. 시상식 내내 은메달을 만지작거렸다.`;}},
    {label:'팀 수비로 묶는다',sub:'농구 IQ',act:()=>{if(chance(clamp(.5+(s.attr.iq-rO())*.03,.2,.8))){rv.w=(rv.w||0)+1;lf(s,'fame',3);tr(s,'iq',1);return `더블팀으로 ${r.name}을 12점에 묶었다. 우승.`;}lf(s,'mental',-2);return '그래도 막을 수 없는 선수가 있다는 걸 배웠다.';}}]));}
  else if(rv.ch===1&&s.stage==='pro'){rv.ch=2;const rlg=s.team.league;const tm=pick(TEAMS[rlg==='sangmu'?'kbl':rlg]||['다른 팀']);rv.team=tm;out.push(()=>chap(s,A,2,4,'같은 무대',`${J(r.name,'도')} 프로에 입성했다. 소속은 ${tm}. 기자들이 벌써 "세대 라이벌"이라는 제목을 뽑았다.`.replace('도도','도'),[
    {label:'축하 메시지를 보낸다',sub:'관계 +',act:()=>{r.bond=clamp(r.bond+12,0,100);return `"코트에서 보자." 짧은 답장이 왔다.`;}},
    {label:'보란 듯이 이기겠다',sub:'승부욕',act:()=>{s.flags.clutchBoost=(s.flags.clutchBoost||0)+.015;lf(s,'mental',3);return '시즌 일정표에서 그 팀과의 경기에 빨간 동그라미를 쳤다.';}}]));}
  else if(rv.ch===2&&s.stage==='pro'&&s.age>=25){rv.ch=3;out.push(()=>chap(s,A,3,4,'라이벌 매치',`정규리그 1위 결정전. 상대는 ${r.name}의 ${rv.team||'팀'}. 전국 생중계, 시청률이 올 시즌 최고다.`,[
    {label:'끝까지 1대1',sub:'내가 막고 내가 넣는다',act:()=>{if(chance(clamp(.5+(ovr(s)-rO())*.04,.15,.85))){rv.w=(rv.w||0)+1;lf(s,'fame',6);s.flags.clutchBoost=(s.flags.clutchBoost||0)+.02;s.legacy+=1;return `${r.name}과의 매치업에서 32점. 하이라이트 첫 장면은 내 몫이었다.`;}lf(s,'mental',-5);return `${r.name}이 그날의 주인공이었다. 인정할 수밖에 없다.`;}},
    {label:'팀을 믿는다',sub:'팀 케미',act:()=>{bondTeam(s,8);if(chance(.5)){rv.w=(rv.w||0)+1;return '동료들이 고르게 터졌다. 이겼다.';}return '접전 끝에 졌다. 다음 시즌을 기약했다.';}}]));}
  else if(rv.ch===3&&s.stage==='retired'){rv.ch=4;out.push(()=>chap(s,A,4,4,'마지막 맞대결',`${J(r.name,'이/가')} 은퇴 경기에 나를 불렀다. "우리 마지막으로 한 번 더 붙자." 상대 전적은 ${rv.w||0}승. 이제 숫자는 중요하지 않다.`,[
    {label:'함께 코트에 선다',sub:'관계 최대',act:()=>{r.bond=100;r.type='라이벌';lf(s,'happy',12);st(s).rivalPeace=true;log(s,`${J(r.name,'과/와')} 은퇴 경기에서 마지막으로 맞붙었다.`,'major');return '경기가 끝나고 둘이 센터 서클에 누워 천장을 봤다. "고마웠다." 동시에 말했다.';}},
    {label:'객석에서 박수를 보낸다',sub:'조용한 존중',act:()=>{r.bond=clamp(r.bond+15,0,100);lf(s,'happy',5);return '그가 객석의 나를 찾아 손가락으로 가리켰다.';}}]));}
  return out;
}
function storyChapters(s){
  const out=[];
  if(s.stage==='army'&&!st(s).armyDone){st(s).armyDone=true;out.push(...armyStory(s));}
  if(s.contract?.military&&!st(s).sangmuDone){st(s).sangmuDone=true;out.push(...sangmuStory(s));}
  out.push(...abroadStory(s));
  out.push(...injuryStory(s));
  out.push(...rivalStory(s));
  return out;
}

const ENDKEY=SAVE_KEY+':endings';
function endingStats(s){
  const pro=s.seasons.filter(x=>LG[x.lg].kind==='pro'&&x.lg!=='sangmu');
  const cnt=k=>s.awards.filter(a=>a.key===k).length;
  const top=pro.filter(x=>x.lg==='nba'||x.lg==='wnba');
  const teams=new Set(pro.map(x=>x.team));
  const kids=s.relations.filter(r=>r.type==='자녀').length;
  return {pro,top,teams,kids,mvp:cnt('mvp'),champ:s.awards.filter(a=>a.key==='champ'&&LG[a.lg]?.kind==='pro').length,
    topStar:s.awards.some(a=>(a.lg==='nba'||a.lg==='wnba')&&(a.key==='allstar'||a.key==='mvp')),married:s.relations.some(r=>r.type==='배우자'),net:netWorth(s)};
}

function skipSlots(s){return isPlaying(s)?['shoot','weight','defense','rest','film']:['pickup','health','work'];}
function autoResolve(spec){
  if(spec.autoPick!=null&&spec.choices[spec.autoPick]){let r;try{r=spec.choices[spec.autoPick].act();}catch(e){console.error(e);r=null;}return absorb(spec,r);}
  if(spec.auto){let r;try{r=spec.auto();}catch(e){console.error(e);r=null;}return absorb(spec,r);}
  const ch=spec.choices.filter(c=>!c.disabled);

function absorb(spec,r){

/* ================= modal ================= */
const SNAP_LIFE={happy:'행복',health:'건강',mental:'멘탈',fame:'인기',smarts:'학업'};
function snap(s){const o={OVR:ovr(s),'키':s.height};for(const k in SNAP_LIFE)o[SNAP_LIFE[k]]=s.life[k];for(const k of ATTRS)o[ATTR_KO[k]]=s.attr[k];o['돈']=s.money;o['가족 예산']=s.flags.famBudget||0;return o;}
function deltas(a,b){
  const out=[];
  for(const k in a){
    const d=b[k]-a[k];
    if(k==='돈'||k==='가족 예산'){if(Math.abs(d)>=1)out.push(`<i class="${d<0?'neg':''}">${k} ${d>0?'+':'-'}${fmtMoney(Math.abs(d))}</i>`);continue;}
    const r=Math.round(d);
    if(r!==0)out.push(`<i class="${r<0?'neg':''}">${k} ${r>0?'+':''}${r}</i>`);
  }
  return out.length?`<div class="deltas">${out.join('')}</div>`:'';
}
function nextModal(){
  while(queue.length){
    if(!S.alive)break;
    let spec=null;
    try{spec=queue.shift()();}catch(e){console.error(e);}
    if(!spec)continue;
    if(UI.skip){
      if(autoResolve(spec))continue;
      const st=UI.skip.start;UI.skip=null;queue.unshift(()=>spec);save();
      showModal(skipSummarySpec(S,st,'decision'));return;
    }
    if(suppressed(spec)&&autoSuppressed(spec))continue;
    showModal(spec);return;
  }
  closeModal();
  save();render();
  if(UI.skip){
    if(!S||!S.alive){UI.skip=null;return;}
    if(UI.skip.left>0){UI.skip.left--;toast('시간 건너뛰는 중',`${S.age}세 · ${S.year}년`,'');setTimeout(()=>ageUp(true),15);}
    else{const st=UI.skip.start;UI.skip=null;showModal(skipSummarySpec(S,st,'done'));}
  }
}
function showModal(spec){
  UI.modalOpen=true;
  const m=$('#modal');m.hidden=false;
  m.querySelector('.sheet').className='sheet '+(spec.cls||'');
  $('#mKicker').textContent=spec.kicker||'';
  $('#mTitle').textContent=spec.title||'';
  $('#mBody').innerHTML=(spec.board||'')+(spec.body||'');
  const box=$('#mChoices');box.innerHTML='';
  spec.choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice '+(c.primary?'primary ':'')+(c.cls||'');
    b.disabled=!!c.disabled;
    if(c.primary)b.textContent=c.label;
    else b.innerHTML=`<span class="c-main"><strong>${c.html?c.label:esc(c.label)}</strong>${c.disabled&&c.reason?`<small>${esc(c.reason)}</small>`:c.sub?`<small>${esc(c.sub)}</small>`:''}</span>${c.tag?`<span class="c-tag">${esc(c.tag)}</span>`:''}`;
    b.onclick=()=>{
      const before=snap(S);
      let r;try{r=c.act();}catch(e){console.error(e);r=null;}
      handleResult(spec,r,before);
    };
    box.appendChild(b);
  });
  render();
  if(spec.onShow)spec.onShow();
  setTimeout(()=>{const f=box.querySelector('button:not(:disabled)');f&&f.focus({preventScroll:true});},30);
}
function handleResult(spec,r,before){
  const d=deltas(before,snap(S));
  render();
  if(r==null){nextModal();return;}
  if(typeof r==='string'){log(S,`${spec.title}: ${r}`);if(!SET.results){toast(spec.title,r,d);nextModal();return;}resultView(spec,r,d,null);return;}
  if(r.meter){showMeter(r.meter,before);return;}
  if(r.spec){showModal(r.spec);return;}
  if(r.text){if(!r.nolog)log(S,`${spec.title}: ${r.text}`);if(!SET.results){toast(spec.title,r.text,d);if(r.next)showModal(r.next);else nextModal();return;}resultView(spec,r.text,d,r.next||null,r.board);return;}
  nextModal();
}
/* ---- timing meter mini-game ---- */
const meterState={raf:0,active:false,key:null};
function showMeter(cfg,before){

  UI.modalOpen=true;$('#modal').hidden=false;$('#modal .sheet').className='sheet';
  $('#mKicker').textContent=cfg.kicker||'';

  const zone=clamp(cfg.zone??clamp((cfg.p??.5)*.55,.06,.46),.05,.6);

    <div class="mg" id="mg"><div class="mg-track"><div class="mg-zone" style="left:${(center-zone/2)*100}%;width:${zone*100}%"></div><div class="mg-perf" style="left:${(center-perf/2)*100}%;width:${perf*100}%"></div><div class="mg-needle" id="mgNeedle"></div></div>
    <div class="mg-hint" id="mgHint">${esc(cfg.hint||'바늘이 초록 구간에 올 때 누르세요 · 스페이스바 가능')}</div></div>`;

  box.append(go,auto);
  let pos=0;const t0=performance.now();const needle=$('#mgNeedle');

  meterState.raf=requestAnimationFrame(tick);

    window.removeEventListener('keydown',meterState.key);

    const label={perfect:'PERFECT',good:'GOOD',miss:'MISS'}[q];

  };
  const press=()=>{if(!meterState.active)return;const dist=Math.abs(pos-center);finish(dist<=perf/2?'perfect':dist<=zone/2?'good':'miss');};
  go.onclick=press;
  auto.onclick=()=>{if(!meterState.active)return;meterState.active=false;cancelAnimationFrame(meterState.raf);window.removeEventListener('keydown',meterState.key);let r;try{r=cfg.done(chance(cfg.p??.5)?'good':'miss',true);}catch(e){console.error(e);r=null;}handleResult(cfg,r,before);};
  meterState.key=e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();press();}};

}

function routineOf(s){if(!s.routine)s.routine={on:false,bmAuto:false,slots:PRESETS.grow.slots.slice()};return s.routine;}
function actUsable(s,a){if(!a||a.legend||!actAvailable(s,a))return false;if(a.yearly&&s.flags.yearly?.[a.id])return false;const c=a.cost?a.cost(s):0;return !c||wallet(s)>=c;}
function autoDrill(s){const p=clamp(.4+(s.attr.shoot-lvl(s))*.012,.15,.88);let m=0;for(let i=0;i<5;i++)if(chance(p))m++;tr(s,'shoot',.7*m);lf(s,'health',-1);return `5개 중 ${m}개 성공.`;}
function performAct(s,a){

  const txt=a.mini?autoDrill(s):a.run(s);
  s.ap--;s.flags.yearly=s.flags.yearly||{};if(a.yearly)s.flags.yearly[a.id]=1;

function runRoutine(s,showToast,slots){
  const r=slots?{slots}:routineOf(s);const before=snap(s);const done=[];
  let guard=0;
  while(s.ap>0&&guard++<12){
    const idx=s.apMax-s.ap;const want=ACTS.find(x=>x.id===r.slots[idx]);
    let a=actUsable(s,want)?want:null;
    if(!a&&r.slots[idx]!=='none'){a=r.slots.map(id=>ACTS.find(x=>x.id===id)).find(x=>actUsable(s,x))||['rest','pickup','study'].map(id=>ACTS.find(x=>x.id===id)).find(x=>actUsable(s,x));}

    if(performAct(s,a)!=null)done.push(a.name);else s.ap--;

function itemReq(s,it){

  if(it.once&&(s.assets.some(a=>a.id===it.id)||s.flags.bought?.[it.id]))return '이미 했다';
  if(it.repeat==='year'&&s.flags.yearly?.['buy_'+it.id])return '올해는 이미 했다';
  if(it.ap&&s.ap<=0)return '올해 행동 없음';

function ownedHTML(s){

function finState(){if(!UI.fin)UI.fin={k:'etf',mode:'buy',amt:0};return UI.fin;}

      <b class="num amt-prev" id="finPrev">${fmtMoney(f.amt)}</b>
    </div>
    <input type="range" id="finPct" min="0" max="100" step="1" value="${pct}" aria-label="${f.mode==='buy'?'현금':'보유액'} 대비 비율" ${kid||!base?'disabled':''}>
    <div class="pct-row">${[10,25,50,75,100].map(v=>`<button class="chipb" data-finpct="${v}" ${kid||!base?'disabled':''}>${v===100?(f.mode==='buy'?'전액':'전량'):v+'%'}</button>`).join('')}</div>

  <p class="sb-note" style="margin-top:8px">수익률은 매년 시즌이 끝날 때 반영되고 복리로 굴러간다. 언제든 매도해 현금으로 바꿀 수 있다.</p>`;
}
function finTrade(){
  const s=S,f=finState();if(UI.modalOpen||s.age<19)return;
  const amt=clamp(Math.round(f.amt||0),0,finBase(s,f));if(!amt)return;
  const p=port(s),F=FIN[f.k];
  if(f.mode==='buy'){s.money-=amt;p[f.k]=(p[f.k]||0)+amt;log(s,`${F.n} ${fmtMoney(amt)} 매수.`);toast(F.n,`${fmtMoney(amt)} 매수. 수익률은 매년 시즌 뒤 반영된다.`,'');}
  else{p[f.k]-=amt;s.money+=amt;log(s,`${F.n} ${fmtMoney(amt)} 매도.`);toast(F.n,`${fmtMoney(amt)} 현금화.`,'');}
  f.amt=0;save();render();
}

function ballSVG(cls){return `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#ef6620" stroke="#2a1806" stroke-width="1.6"/><path d="M2 16h28M16 2v28M6 6c5 4 5 16 0 20M26 6c-5 4-5 16 0 20" fill="none" stroke="#2a1806" stroke-width="1.6"/></svg>`;}
function tabHTML(s){
  if(UI.tab==='act')return actHTML(s);
  if(UI.tab==='career')return careerHTML(s);
  if(UI.tab==='people')return peopleHTML(s);
  if(UI.tab==='money')return moneyHTML(s);
  if(UI.tab==='news')return newsHTML(s);
  return feedHTML(s);
}
function feedHTML(s){
  const groups=[];let cur=null;
  for(let i=s.log.length-1;i>=0;i--){const e=s.log[i];if(!cur||cur.age!==e.age){cur={age:e.age,year:e.year,items:[]};groups.push(cur);}cur.items.push(e);}
  return `<div class="feed">${groups.slice(0,60).map(g=>`<div class="yr"><div class="yr-age num">${g.age}세<small>${g.year}</small></div><ul>${g.items.map(e=>`<li class="${e.tone}">${esc(e.text)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}
function routineHTML(s){

      <button class="btn hot" id="rtNow" ${s.ap<=0||UI.modalOpen?'disabled':''}>지금 루틴 실행</button>

  const counts={};s.awards.forEach(a=>{counts[a.name.replace(/^\d{4} /,'')]=(counts[a.name.replace(/^\d{4} /,'')]||0)+1;});
  const trophies=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

    btns.push(`<button class="btn hot" id="btnTrade" ${UI.modalOpen?'disabled':''}>이적 시장${s.flags.yearly?.trade?' (올해 시도함)':''}</button>`);

  }

    btns.push(`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">포지션 변경 <select id="posSel" style="background:#0b1527;color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:6px">${Object.keys(POS).map(p=>`<option value="${p}" ${p===s.pos?'selected':''}>${p} ${POS[p].ko}</option>`).join('')}</select></label>`);
  }

function rosterHTML(s){

  const me={name:s.name,pos:s.pos,age:s.age,o:ovr(s),me:true};

  return `<h3 style="margin-top:18px">${esc(s.team.name)} 주요 선수 <em>노란 표시는 실제 선수 · 2025-26 기준</em></h3><div class="roster">${all.map(p=>`<div class="${p.me?'me':''}"><span>${esc(p.name)}${p.real?'<i class="real">REAL</i>':''}<small>${p.pos} · ${p.age}세${p.me?' · 나':''}</small></span><b class="${tierCls(p.o)}">${p.o}</b></div>`).join('')}</div>`;
}
function sparkSVG(s){
  const pts=s.ovrHist;if(pts.length<2)return '<div class="empty">한 해가 지나면 그래프가 그려진다.</div>';
  const W=600,H=120,pl=28,pr=10,pt=10,pb=20;
  const a0=pts[0].age,a1=pts[pts.length-1].age;
  const x=a=>pl+(a-a0)/Math.max(1,a1-a0)*(W-pl-pr),y=v=>pt+(1-v/100)*(H-pt-pb);
  const line=pts.map(p=>`${x(p.age).toFixed(1)},${y(p.o).toFixed(1)}`).join(' ');
  const area=`${x(a0)},${y(0)} ${line} ${x(a1)},${y(0)}`;
  const peak=pts.reduce((m,p)=>p.o>m.o?p:m,pts[0]);
  const ticks=[0,25,50,75,100];
  const lvLines=s.gender==='m'?[['KBL',68],['NBA',80]]:[['WKBL',64],['WNBA',76]];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="나이별 종합 능력치">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#284069" stroke-width="1" stroke-dasharray="${t?'2 4':''}"/><text x="${pl-6}" y="${y(t)+4}" fill="#60739a" font-size="10" text-anchor="end">${t}</text>`).join('')}
    ${lvLines.map(([n,v])=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ffc443" stroke-opacity=".35" stroke-width="1"/><text x="${W-pr-2}" y="${y(v)-3}" fill="#ffc443" fill-opacity=".7" font-size="10" text-anchor="end">${n} 주전</text>`).join('')}
    <polygon points="${area}" fill="#ef6620" fill-opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="#ff8c47" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(peak.age)}" cy="${y(peak.o)}" r="3.5" fill="#ffc443"/>
    <text x="${x(a0)}" y="${H-5}" fill="#60739a" font-size="10">${a0}세</text><text x="${x(a1)}" y="${H-5}" fill="#60739a" font-size="10" text-anchor="end">${a1}세</text>
  </svg><div class="sb-note" style="margin-top:4px">최고점 ${peak.o} (${peak.age}세)</div>`;
}

function moneyHTML(s){

    <div class="panel how"><b>엔딩 도감 ${endingsSeen().length} / ${ENDINGS.length}</b> · 인생의 갈래마다 다른 엔딩이 기다린다.<br><br><b>플레이 방법</b><br>매년 정해진 <b>행동</b>으로 훈련, 휴식, 공부를 고르고 <b>시즌 진행</b>을 누른다. 시즌 중에는 클러치 순간과 사건이 찾아오고, 고교 졸업 뒤엔 대학 · NCAA · 고졸 드래프트 중 길을 고른다. 프로가 되면 FA 협상과 해외 진출, 남자 선수는 병역(상무 · 아시안게임 금메달 면제)까지 겪는다. 은퇴 후에도 인생은 이어지며, 생을 마치면 레거시 등급이 매겨진다.<br><br><b>직접 하는 것들</b><br>슈팅 챌린지 · 매 시즌 빅매치 4쿼터 지휘 · 클러치 슛 타이밍 · 올스타 3점슛/덩크 콘테스트 · FA 연봉 협상 · 기자회견 · 트레이드 행선지 선택 · 팀 동료와의 케미<br><br><span style="color:var(--dim)">KBL·WKBL·NBA·WNBA·B.리그·W리그 팀과 일부 선수는 실제 이름을 쓴다(2025-26 시즌 기준). 능력치는 게임용 추정치이며 이후 이적과 은퇴는 반영되지 않았다. 각 리그·구단과 무관한 팬 게임이다.</span></div>
  </div></div>`;
}
const HMIN={m:165,f:155},HMAX={m:226,f:206};
function traitBlocked(sel,k){return CONFLICT.some(([a,b])=>(a===k&&sel.includes(b))||(b===k&&sel.includes(a)));}
function potLabel(p){return p>=93?'세대급 재능':p>=85?'슈퍼스타 재목':p>=77?'국가대표 재목':p>=68?'프로 주전감':p>=58?'프로 백업감':'평범한 재능';}
function customGenHTML(d){
  const g=d.gen,sel=g.traits,str=g.strengths||[];
  return `
  <div class="field"><label for="fPot">잠재력 <span class="stars" id="potStars">${starStr(potStars(g.pot))}</span></label>
    <input type="range" id="fPot" min="45" max="99" value="${g.pot}">
    <div class="gen-row" style="border:0;padding:0"><span id="potTxt">${potLabel(g.pot)}</span><b id="potNum">${g.pot}</b></div></div>
  <div class="field"><label for="fH">성인 신장</label>
    <input type="range" id="fH" min="${HMIN[d.gender]}" max="${HMAX[d.gender]}" step="0.5" value="${g.adultHeight}">
    <div class="gen-row" style="border:0;padding:0"><span id="hTxt">${POS[d.pos].ko} 평균 ${posBaseOf(d)}cm</span><b id="hNum">${(+g.adultHeight).toFixed(1)}cm</b></div></div>
  <div class="field"><span class="lbl">특성 <em style="font-style:normal;font-weight:500;letter-spacing:0;color:var(--dim)">최대 3개 · ${sel.length}/3</em></span>
    <div class="pick-grid">${Object.keys(TRAITS).filter(k=>k!=='tall').map(k=>{const on=sel.includes(k);const dis=!on&&(sel.length>=3||traitBlocked(sel,k));
      return `<button type="button" class="pick ${TRAITS[k].neg?'neg':''}" data-trait="${k}" aria-pressed="${on}" ${dis?'disabled':''}><b>${TRAITS[k].ko}</b><small>${TRAITS[k].desc}</small></button>`;}).join('')}</div></div>
  <div class="field"><span class="lbl">타고난 강점 <em style="font-style:normal;font-weight:500;letter-spacing:0;color:var(--dim)">최대 3개 · 시작 +6, 한계치 +5 · ${str.length}/3</em></span>
    <div class="pick-grid small">${ATTRS.map(k=>{const on=str.includes(k);return `<button type="button" class="pick" data-str="${k}" aria-pressed="${on}" ${!on&&str.length>=3?'disabled':''}><b>${ATTR_KO[k]}</b></button>`;}).join('')}</div></div>
  <button class="btn" id="btnRoll" type="button">랜덤으로 채우기</button>`;
}
function posBaseOf(d){return POS[d.pos].h-(d.gender==='f'?13:0);}
function bindStart(){
  const d=UI.draft;
  $('#fName').oninput=e=>d.name=e.target.value;
  $('#fNum').oninput=e=>d.number=clamp(parseInt(e.target.value||'0',10)||0,0,99);
  $('#btnRName').onclick=()=>{d.name=koName(d.gender);render();};
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(d.gender!==b.dataset.g){d.gender=b.dataset.g;d.name=koName(d.gender);if(d.gender==='f')d.look.beard=false;if(d.mode==='custom'){d.gen.adultHeight=clamp(d.gen.adultHeight+(d.gender==='f'?-13:13),HMIN[d.gender],HMAX[d.gender]);}else d.gen=rollGenetics(d.gender);}render();});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{d.pos=b.dataset.p;render();});
  $('#btnRoll').onclick=()=>{const st=d.gen.strengths;d.gen=rollGenetics(d.gender);if(d.mode==='custom')d.gen.strengths=st||[];render();};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{d.mode=b.dataset.mode;d.gen.strengths=d.gen.strengths||[];if(d.mode==='custom')d.gen.traits=d.gen.traits.filter(k=>k!=='tall');if(d.mode!=='custom')d.gen.strengths=[];render();});
  $('#fHome').onchange=e=>{d.home=e.target.value;};
  bindLook('lk',d.look,()=>render());
  $('#btnLookR').onclick=()=>{d.look=randomLook(d.gender);render();};
  const fp=$('#fPot');if(fp){fp.oninput=()=>{d.gen.pot=+fp.value;$('#potNum').textContent=fp.value;$('#potTxt').textContent=potLabel(+fp.value);$('#potStars').textContent=starStr(potStars(+fp.value));};}
  const fh=$('#fH');if(fh){fh.oninput=()=>{d.gen.adultHeight=+fh.value;$('#hNum').textContent=(+fh.value).toFixed(1)+'cm';};}
  document.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{const k=b.dataset.trait,t=d.gen.traits;const i=t.indexOf(k);if(i>=0)t.splice(i,1);else if(t.length<3&&!traitBlocked(t,k))t.push(k);render();});
  document.querySelectorAll('[data-str]').forEach(b=>b.onclick=()=>{const k=b.dataset.str,t=d.gen.strengths=d.gen.strengths||[];const i=t.indexOf(k);if(i>=0)t.splice(i,1);else if(t.length<3)t.push(k);render();});
  $('#btnStart').onclick=()=>{const name=(d.name||'').trim()||koName(d.gender);S=newGame({...d,name,number:clamp(+d.number||0,0,99)});UI.draft=null;UI.tab='act';save();render();
    showModal({kicker:`${S.year} · 8세`,title:'첫 농구공',body:`<p>아버지가 퇴근길에 낡은 농구공을 사 오셨다. 동네 코트의 림은 그물이 반쯤 찢어져 있다.</p>`,
      choices:[{label:'해가 질 때까지 슛을 쏜다',act:()=>{at(S,'shoot',2);lf(S,'happy',4);return '백 개 중에 열 개가 들어갔다. 열 개가 전부 기억난다.';}},{label:'드리블하며 동네를 한 바퀴 돈다',act:()=>{at(S,'handle',2);lf(S,'happy',4);return '공이 발에 차여 도랑에 빠질 뻔했다. 그래도 신났다.';}}]});};
  const c=$('#btnCont');if(c)c.onclick=()=>{load();render();};
  const lb=document.querySelector('.loadbox');if(lb){const refresh=()=>{const l=lb.querySelector('#slotList');if(l){l.innerHTML=slotRowsHTML(false);}bindSlots(lb,refresh);};bindSlots(lb,refresh);}
}

/* ================= ending ================= */
function grade(L){return L>=520?['S+','GOAT']:L>=320?['S','살아있는 전설']:L>=190?['A','명예의 전당']:L>=110?['B','프랜차이즈 스타']:L>=55?['C','꾸준한 프로']:L>=18?['D','코트 위의 노동자']:['F','이루지 못한 꿈'];}
function endHTML(s){
  const [g,t]=grade(s.legacy);
  const pro=s.seasons.filter(x=>LG[x.lg].kind==='pro'),gp=pro.reduce((a,x)=>a+x.gp,0);
  const tot=k=>Math.round(pro.reduce((a,x)=>a+x[k]*x.gp,0));
  const cnt=k=>s.awards.filter(a=>a.key===k).length;
  const champs=cnt('champ'),mvps=cnt('mvp'),alls=cnt('allstar');
  const proChamps=s.awards.filter(a=>a.key==='champ'&&LG[a.lg]?.kind==='pro').length;
  const nba=pro.some(x=>x.lg==='nba'||x.lg==='wnba');
  let ep;
  if(mvps>=3)ep=`리그 MVP ${mvps}회. 한 시대를 지배한 이름.`;
  else if(s.awards.some(a=>a.key==='olympic'))ep='올림픽 시상대에 태극기를 올린 사람.';
  else if(nba)ep=`${s.gender==='m'?'NBA':'WNBA'} 코트를 밟은 몇 안 되는 한국 선수.`;
  else if(proChamps>=2)ep=`프로 우승 반지 ${proChamps}개. 이기는 법을 알았던 선수.`;
  else if(s.flags.hof)ep='명예의 전당에 이름을 남겼다.';
  else if(s.flags.elected==='nat')ep='코트에서 국회까지. 두 번째 인생도 뜨거웠다.';
  else if(s.assets.some(a=>a.eff==='owner'))ep='선수로 시작해 구단주로 끝났다.';
  else if(s.flags.actor)ep='농구선수, 그리고 배우.';
  else if(pro.length>=10)ep=`${pro.length}시즌 동안 코트를 지킨 성실한 프로.`;
  else if(pro.length&&s.settled&&s.stage==='pro')ep=`${pro.length}번째 시즌을 마치고 기록을 멈췄다. 이야기는 아직 진행 중이었다.`;
  else if(pro.length)ep='짧았지만 프로의 꿈을 이뤘다.';
  else if(s.settled&&['elem','middle','high','college'].includes(s.stage))ep='아직 쓰이지 않은 이야기. 여기서 기록을 멈췄다.';
  else ep='농구 선수의 꿈은 이루지 못했지만, 그 시절의 땀은 남았다.';
  const majors=s.log.filter(e=>e.tone==='major'&&!e.text.startsWith('[속보]')).slice(-14);
  const eid=recordEnding(s),E=ENDINGS.find(x=>x.id===eid)||ENDINGS[ENDINGS.length-1],eNo=ENDINGS.indexOf(E)+1;
  let story=[];try{story=E.story(s,endingStats(s));}catch(_){}
  const seen=endingsSeen();
  const endingBlock=`<section class="ending" aria-label="엔딩"><div class="eno">ENDING ${String(eNo).padStart(2,'0')} / ${ENDINGS.length}</div><h2>${esc(E.t)}</h2>${story.map(p=>`<p>${esc(p)}</p>`).join('')}</section>`;
  const dex=`<div class="panel"><h3>엔딩 도감 <em>${seen.length} / ${ENDINGS.length} 발견 · 이 브라우저 기준</em></h3><div class="dex">${ENDINGS.map((x,i)=>{const got=seen.includes(x.id);return `<div class="${got?'':'lock'} ${x.id===eid?'now':''}"><b>${String(i+1).padStart(2,'0')} · ${got?esc(x.t):'???'}</b><small>${esc(x.hint)}</small></div>`;}).join('')}</div></div>`;
  return `<div class="wrap"><div class="end">
    <div class="end-hero">
      <div class="end-av">${avatarSVG(s.look,{age:s.age,gender:s.gender,jersey:teamColor((s.flags.lastTeam||{}).name),number:s.number,cls:'avatar end-avatar'})}<div class="grade">${g}</div></div>
      <h1>${esc(s.name)}</h1>
      <div class="life num">${START_YEAR-8} – ${s.deathYear||s.year} · ${s.settled?`${s.age}세에 정산`:`향년 ${s.age}세`} · #${s.number} ${s.pos}</div>
      <div class="title">${t}</div>${s.sig?.nick?`<div class="sb-note" style="margin-top:4px">"${esc(s.sig.nick)}"${s.sig.move?` · 시그니처 「${esc(s.sig.move.name)}」`:''}${s.sig.celeb?` · 세리머니 「${esc(s.sig.celeb)}」`:''}</div>`:''}
      ${s.sig?.shoe?`<div style="margin-top:8px">${shoeSVG(s.sig.shoe,'shoe sm')}<div class="sb-note">${esc(s.sig.shoe.brand)} ${esc(s.sig.shoe.name)} 1~${s.sig.shoe.ver} · 누적 ${fmtMoney(s.sig.shoe.sold||0)}</div></div>`:''}
      <p class="epitaph">${esc(ep)}</p>
    </div>
    ${endingBlock}
    <div class="panel"><h3>커리어 요약</h3><div class="kv">
      <div><span>프로 시즌</span><b class="num">${pro.length}</b></div>
      <div><span>프로 통산 득점</span><b class="num">${tot('pts').toLocaleString('ko-KR')}</b></div>
      <div><span>평균 기록</span><b>${gp?`${(tot('pts')/gp).toFixed(1)}점 ${(tot('reb')/gp).toFixed(1)}리바 ${(tot('ast')/gp).toFixed(1)}어시`:'—'}</b></div>
      <div><span>우승 (전체 / 프로)</span><b class="num">${champs} / ${proChamps}</b></div>
      <div><span>MVP · 올스타</span><b class="num">${mvps} · ${alls}</b></div>
      <div><span>레거시 점수</span><b class="num">${Math.round(s.legacy)}</b></div>
      <div><span>최종 자산</span><b class="num">${fmtMoney(netWorth(s))}</b></div>
      <div><span>최고 능력치</span><b class="num">${Math.max(...s.ovrHist.map(p=>p.o))}</b></div>
    </div></div>
    <div class="panel"><h3>결정적 순간들</h3><div class="feed">${majors.map(e=>`<div class="yr"><div class="yr-age num">${e.age}세<small>${e.year}</small></div><ul><li class="major">${esc(e.text)}</li></ul></div>`).join('')}</div></div>
    ${dex}
    <button class="cta" id="btnAgain">새 인생 시작</button>
  </div></div>`;
}
function bindEnd(){$('#btnAgain').onclick=()=>{S=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}render();};}

/* ================= persistence ================= */
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){S=JSON.parse(raw);applyWorld(S);UI.tab=localStorage.getItem(SAVE_KEY+':tab')||'feed';}}catch(e){S=null;}}

function start(data){
  if(data&&data.S)S=data.S;
  render();
  if(S&&S.alive&&data&&data.pending){/* modal state is not restorable mid-choice; continue normally */}
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
