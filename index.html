<title>버저비터 라이프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="8살 첫 농구공부터 은퇴 후의 삶까지, 농구선수의 인생을 키우는 텍스트 라이프 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Teko:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: arena-night console — trading-card rail on the left, play-by-play feed + tabs on the right, scorer's-table bar pinned to the bottom */
  --arena:#0b1322;
  --stands:#101c31;
  --panel:#15253f;
  --panel-2:#1b2f4f;
  --line:#284069;
  --chalk:#eef2f8;
  --muted:#93a6c6;
  --dim:#60739a;
  --leather:#ef6620;
  --leather-hi:#ff8c47;
  --led:#ffc443;
  --maple:#d4a66c;
  --maple-dk:#a97a44;
  --good:#45d391;
  --bad:#ff6767;
  --info:#72b6ff;
  --f-disp:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-num:'Teko','Noto Sans KR',system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--arena);color:var(--chalk)}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
  background:
    radial-gradient(1200px 520px at 50% -180px, rgba(255,196,67,.09), transparent 70%),
    radial-gradient(700px 400px at 100% 0, rgba(239,102,32,.06), transparent 70%),
    var(--arena);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--led);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== top bar ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-ball{width:26px;height:26px;flex:none}
.brand b{color:var(--leather-hi);font-weight:400}
.top-right{display:flex;align-items:center;gap:8px}
.chip-led{font-family:var(--f-num);font-size:20px;line-height:1;padding:6px 10px 3px;border-radius:6px;background:#060b14;color:var(--led);border:1px solid #2a2410;text-shadow:0 0 10px rgba(255,196,67,.45);white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:13px}
.ghost:hover{color:var(--chalk);border-color:var(--muted)}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:120px}
@media (min-width:920px){.grid{grid-template-columns:360px minmax(0,1fr);align-items:start}.rail{position:sticky;top:12px}}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.mainp{min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:919px){.rail{display:contents}.rail .card{order:1}.rail .p-life{order:2}.mainp{order:3}.rail .p-attr{order:4}}

/* ===== trading card ===== */
.card{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.card-top{
  position:relative;overflow:hidden;padding:14px 16px 12px;min-height:118px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 46px, rgba(0,0,0,.10) 46px 47px),
    repeating-linear-gradient(90deg, var(--maple) 0 22px, #c8955a 22px 47px, #d9ae76 47px 70px),
    var(--maple);
  color:#2a1806;
}
.card-top::after{content:"";position:absolute;inset:auto -20% -60px auto;width:220px;height:120px;border:3px solid rgba(255,255,255,.35);border-radius:50%;}
.jersey{position:absolute;right:14px;top:4px;font-family:var(--f-num);font-size:96px;line-height:1;font-weight:600;color:rgba(42,24,6,.82);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.pos-badge{display:inline-block;font-family:var(--f-num);font-size:18px;line-height:1;padding:4px 8px 1px;border-radius:5px;background:#2a1806;color:var(--maple)}
.card-name{font-family:var(--f-disp);font-size:28px;line-height:1.15;margin-top:8px;max-width:70%;word-break:keep-all}
.card-sub{font-size:13px;font-weight:700;opacity:.8}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ovr-row{display:flex;align-items:center;gap:14px}
.ovr{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 30%, var(--leather-hi), var(--leather) 60%, #b84612);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);position:relative;color:#fff}
.ovr::before,.ovr::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ovr::before{border-left:2px solid rgba(0,0,0,.3);border-right:2px solid rgba(0,0,0,.3);inset:0 22px}
.ovr::after{border-top:2px solid rgba(0,0,0,.3);top:50%;height:0}
.ovr span{position:relative;z-index:1;font-family:var(--f-num);font-size:38px;line-height:.8;padding-top:8px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ovr small{display:block;font-family:var(--f-body);font-size:9px;font-weight:900;letter-spacing:.14em;opacity:.9}
.ovr-meta{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;color:var(--muted)}
.ovr-meta strong{color:var(--chalk);font-weight:700}
.stars{color:var(--led);letter-spacing:2px}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--chalk);background:var(--panel-2)}
.trait.neg{border-color:rgba(255,103,103,.45)}

/* ===== panels ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 em{font-style:normal;letter-spacing:0;font-weight:500;text-transform:none;color:var(--dim)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.meter label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter label b{font-family:var(--f-num);font-size:17px;line-height:1;color:var(--chalk);font-weight:500}
.bar{height:6px;border-radius:3px;background:#0b1527;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s ease}
.money-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:13px;color:var(--muted)}
.money-row b{font-family:var(--f-num);font-size:24px;line-height:1;color:var(--led);font-weight:500}

.attrs{display:flex;flex-direction:column;gap:7px}
.attr{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:10px;font-size:13px}
.attr span{color:var(--muted);white-space:nowrap}
.attr .track{position:relative;height:8px;border-radius:4px;background:#0b1527}
.attr .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.attr .track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5;text-decoration:none}
.attr b{font-family:var(--f-num);font-size:19px;line-height:1;text-align:right;font-weight:500}
.t-elite{color:var(--led)} .t-good{color:var(--good)} .t-mid{color:var(--chalk)} .t-low{color:var(--muted)}

/* ===== tabs ===== */
.tabs{display:flex;gap:4px;background:var(--stands);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;font-weight:700;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--leather)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--leather);color:#fff;font-size:11px;line-height:18px}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:2px}
.yr{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid rgba(40,64,105,.55)}
.yr:last-child{border-bottom:0}
.yr-age{font-family:var(--f-num);font-size:30px;line-height:.9;color:var(--chalk)}
.yr-age small{display:block;font-size:15px;color:var(--dim)}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.yr li{position:relative;padding-left:14px;font-size:14px;color:#d5deec;word-break:keep-all;overflow-wrap:anywhere}
.yr li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--dim)}
.yr li.good::before{background:var(--good)} .yr li.bad::before{background:var(--bad)}
.yr li.major{color:var(--chalk);font-weight:700}
.yr li.major::before{background:var(--led);box-shadow:0 0 8px var(--led)}

/* ===== activity cards ===== */
.ap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;transition:transform .12s ease,border-color .12s}
.act:hover:not(:disabled){border-color:var(--leather);transform:translateY(-1px)}
.act:disabled{opacity:.45}
.act strong{font-size:15px}
.act p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:4px;background:#0e1a2e;color:var(--info)}
.act .cost{font-size:12px;color:var(--led)}

/* ===== career ===== */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:8px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.kv b{display:block;font-size:15px;word-break:keep-all}
.kv b.num{font-size:24px;line-height:1.1;font-weight:500}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45}
.btn.warn{border-color:rgba(255,103,103,.5);color:#ffb3b3}
.btn.hot{background:var(--leather);border-color:var(--leather);color:#fff}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(40,64,105,.5)}
th{background:#0e1a2e;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.05em;position:sticky;top:0}
td:nth-child(-n+3),th:nth-child(-n+3){text-align:left}
td.num{font-size:17px}
tr.champ td{background:rgba(255,196,67,.06)}
.award-mini{color:var(--led);font-size:12px}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
.trophy b{font-family:var(--f-num);font-size:20px;line-height:1;color:var(--arena);background:var(--led);border-radius:5px;padding:3px 6px 0;min-width:26px;text-align:center}
.spark{width:100%;height:120px;display:block}
.empty{color:var(--dim);font-size:13.5px;padding:8px 0}

/* ===== relations ===== */
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:10px;padding:10px 12px}
.person .who{min-width:0}
.person .who b{font-size:15px}
.person .who span{font-size:12px;color:var(--muted);margin-left:6px}
.person .bar{max-width:220px}
.person.gone{opacity:.5}
.person .acts-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.person .acts-mini .btn{padding:6px 10px;font-size:12.5px}
@media (max-width:560px){.person{grid-template-columns:1fr}.person .acts-mini{justify-content:flex-start}}

/* ===== bottom bar ===== */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg, rgba(11,19,34,0), rgba(11,19,34,.92) 30%);padding-top:22px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar-inner{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pips{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.pip{width:16px;height:16px;border-radius:50%;background:#0e1a2e;border:1px solid var(--line);flex:none}
.pip.on{background:radial-gradient(circle at 35% 30%, var(--leather-hi), var(--leather));border-color:#b84612}
.next{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:10px 20px 10px 18px;background:var(--leather);color:#fff;box-shadow:0 10px 30px -10px rgba(239,102,32,.7),inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .1s}
.next:hover:not(:disabled){transform:translateY(-1px);background:var(--leather-hi)}
.next:disabled{opacity:.5}
.next .big{display:block;font-family:var(--f-disp);font-size:19px;line-height:1.1}
.next .yr-mini{display:block;font-family:var(--f-num);font-size:16px;line-height:1;opacity:.85;text-align:left}
.next svg{width:22px;height:22px}
.ff{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted)}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;width:min(520px,calc(100% - 32px));background:#0a1220;border:1px solid var(--line);border-left:3px solid var(--leather);border-radius:10px;padding:10px 14px;box-shadow:0 20px 40px -18px #000;transition:all .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-size:14px}
.toast p{margin:2px 0 6px;font-size:13px;color:#cdd7e8}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.deltas i{font-style:normal;font-size:12px;padding:1px 7px;border-radius:4px;background:rgba(69,211,145,.12);color:var(--good);font-weight:700}
.deltas i.neg{background:rgba(255,103,103,.12);color:var(--bad)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,8,15,.72);backdrop-filter:blur(4px);overflow-y:auto}
.sheet{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -30px #000;animation:pop .22s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.m-kicker{background:#060b14;color:var(--led);font-family:var(--f-num);font-size:19px;line-height:1;padding:10px 18px 6px;letter-spacing:.06em;text-shadow:0 0 10px rgba(255,196,67,.45);border-bottom:1px solid #1d2a40}
.m-in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:25px;line-height:1.2;text-wrap:balance;word-break:keep-all}
.m-body{font-size:15px;color:#d8e0ee;word-break:keep-all;overflow-wrap:anywhere}
.m-body p{margin:0 0 8px}
.m-choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.choice:hover:not(:disabled){border-color:var(--leather);background:#21385d}
.choice:disabled{opacity:.45}
.choice .c-main{min-width:0}
.choice strong{display:block;font-size:15px}
.choice small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.choice .c-tag{flex:none;font-family:var(--f-num);font-size:18px;line-height:1;color:var(--led);padding-top:3px}
.choice.primary{background:var(--leather);border-color:var(--leather);color:#fff;justify-content:center;font-weight:700}
.choice.primary:hover{background:var(--leather-hi)}
.result{background:#0e1a2e;border-radius:10px;padding:12px 14px;border-left:3px solid var(--led)}

/* scoreboard */
.sb{background:#060b14;border:1px solid #1d2a40;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sb-rec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sb-rec .led{font-family:var(--f-num);color:var(--led);font-size:44px;line-height:.85;text-shadow:0 0 14px rgba(255,196,67,.5)}
.sb-rec .led small{font-size:18px;color:#9c7d2e;margin-left:6px}
.sb-res{font-weight:900;font-size:15px;padding:5px 10px;border-radius:6px;background:#1a2438}
.sb-res.win{background:var(--led);color:#1c1300}
.sb-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sb-stats div{background:#0c1424;border-radius:8px;padding:6px 4px 4px;text-align:center}
.sb-stats b{display:block;font-family:var(--f-num);font-size:28px;line-height:.9;color:#ff9a5c;font-weight:500}
.sb-stats span{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sb-awards{display:flex;flex-wrap:wrap;gap:6px}
.sb-awards i{font-style:normal;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,196,67,.14);color:var(--led);border:1px solid rgba(255,196,67,.35)}
.sb-note{font-size:13px;color:var(--muted)}
@media (max-width:440px){.sb-stats b{font-size:23px}.sb-rec .led{font-size:38px}}

/* offers */
.offer .c-main strong{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg-tag{font-size:11px;font-weight:900;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:#0e1a2e;color:var(--info)}
.lg-tag.nba{color:var(--led)}

/* ===== start ===== */
.start{max-width:860px;margin:0 auto;padding-block:28px 60px;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;padding:28px 22px 22px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:
    radial-gradient(circle at 50% 120%, transparent 0 118px, rgba(255,255,255,.12) 119px 121px, transparent 122px),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.1) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
    repeating-linear-gradient(90deg, #c9975c 0 26px, #d3a66d 26px 52px, #c08c51 52px 80px);
  color:#26160a}
.hero h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,9vw,76px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{display:block;font-family:var(--f-num);font-size:.38em;letter-spacing:.32em;color:#6b3d14;margin-bottom:6px}
.hero p{margin:12px 0 0;font-size:15px;font-weight:700;max-width:46ch;color:#3a2410}
.hero .shot-clock{position:absolute;right:18px;top:18px;font-family:var(--f-num);font-size:44px;line-height:1;color:var(--led);background:#060b14;border-radius:8px;padding:6px 12px 1px;text-shadow:0 0 12px rgba(255,196,67,.5)}
.form{display:grid;grid-template-columns:1fr;gap:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--muted)}
.input-row{display:flex;gap:8px}
input[type=text],input[type=number]{width:100%;min-width:0;background:#0b1527;border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--leather)}
.seg{display:flex;background:#0b1527;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:7px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--leather)}
.pos-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pos-grid button{border:1px solid var(--line);background:#0b1527;border-radius:9px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:0}
.pos-grid button b{font-family:var(--f-num);font-size:26px;line-height:1;font-weight:500}
.pos-grid button small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.pos-grid button[aria-pressed="true"]{border-color:var(--leather);background:rgba(239,102,32,.12)}
.gen{display:flex;flex-direction:column;gap:12px}
.gen-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.gen-row span{color:var(--muted);font-size:13px}
.gen-row b{font-family:var(--f-num);font-size:26px;line-height:1;font-weight:500}
.trait-list{display:flex;flex-direction:column;gap:8px}
.trait-card{background:var(--panel-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.trait-card b{display:block;color:var(--chalk);font-size:14px}
.trait-card.neg b{color:#ffb3b3}
.cta{border:0;border-radius:14px;padding:16px;background:var(--leather);color:#fff;font-family:var(--f-disp);font-size:22px;box-shadow:0 14px 30px -12px rgba(239,102,32,.75),inset 0 -3px 0 rgba(0,0,0,.18)}
.cta:hover{background:var(--leather-hi)}
.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--leather);border-radius:12px;padding:12px 16px}
.continue p{margin:0;font-size:14px;color:var(--muted)} .continue p b{color:var(--chalk)}
.how{font-size:13px;color:var(--muted);line-height:1.7}
.how b{color:var(--chalk)}

/* ===== ending ===== */
.end{max-width:760px;margin:0 auto;padding-block:30px 60px;display:flex;flex-direction:column;gap:16px}
.end-hero{text-align:center;padding:26px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.end-hero .grade{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;font-family:var(--f-num);font-size:58px;line-height:1;padding-top:8px;background:radial-gradient(circle at 35% 30%, var(--leather-hi), var(--leather) 60%, #b84612);color:#fff}
.end-hero h1{font-family:var(--f-disp);font-weight:400;font-size:34px;margin:12px 0 2px}
.end-hero .life{font-family:var(--f-num);font-size:22px;color:var(--muted)}
.end-hero .title{display:inline-block;margin-top:8px;font-weight:900;color:var(--led);letter-spacing:.06em}
.epitaph{font-size:16px;color:#dfe6f2;margin:14px auto 0;max-width:46ch;word-break:keep-all}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* ================= utilities ================= */
const START_YEAR = 2026;
const SAVE_KEY = 'buzzer-beater-life-v1';
const rnd = Math.random;
const R = (a,b)=>a+rnd()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const pick = a=>a[Math.floor(rnd()*a.length)];
const chance = p=>rnd()<p;
const gauss = (m,sd)=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return m+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const esc = t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s=>document.querySelector(s);
const hasBatchim = w=>{const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;};
const J = (w,p)=>{if(!p.includes('/'))return w+p;const [a,b]=p.split('/');return w+(hasBatchim(w)?a:b);};
function fmtMoney(m){
  const neg=m<0; m=Math.abs(Math.round(m));
  let t;
  if(m>=10000){const e=m/10000;t=(e>=100?Math.round(e).toLocaleString('ko-KR'):e.toFixed(1).replace(/\.0$/,''))+'억';}
  else t=m.toLocaleString('ko-KR')+'만';
  return (neg?'-':'')+t+' 원';
}

/* ================= data ================= */
const ATTRS=['shoot','inside','handle','pass','defense','rebound','athletic','iq','stamina'];
const ATTR_KO={shoot:'슈팅',inside:'골밑 마무리',handle:'볼핸들링',pass:'패스',defense:'수비',rebound:'리바운드',athletic:'운동능력',iq:'농구 IQ',stamina:'체력'};
const POS={
  PG:{ko:'포인트가드',h:184,w:{shoot:.2,inside:.08,handle:.22,pass:.22,defense:.1,rebound:.02,athletic:.08,iq:.08}},
  SG:{ko:'슈팅가드',h:191,w:{shoot:.3,inside:.1,handle:.14,pass:.08,defense:.12,rebound:.04,athletic:.12,iq:.1}},
  SF:{ko:'스몰포워드',h:197,w:{shoot:.18,inside:.16,handle:.1,pass:.08,defense:.16,rebound:.1,athletic:.14,iq:.08}},
  PF:{ko:'파워포워드',h:201,w:{shoot:.1,inside:.24,handle:.04,pass:.06,defense:.16,rebound:.22,athletic:.12,iq:.06}},
  C:{ko:'센터',h:205,w:{shoot:.04,inside:.28,handle:.02,pass:.06,defense:.2,rebound:.28,athletic:.08,iq:.04}},
};
const LG={
  elem:{name:'초등부',short:'초등부',level:24,games:12,mult:.05,kind:'school'},
  middle:{name:'중등부',short:'중등부',level:37,games:16,mult:.1,kind:'school'},
  high:{name:'고등부',short:'고등부',level:50,games:20,mult:.2,kind:'school'},
  uleague:{name:'대학농구 U-리그',short:'U-리그',level:59,games:16,mult:.35,kind:'college'},
  ncaa:{name:'NCAA 디비전1',short:'NCAA',level:65,games:32,mult:.6,kind:'college'},
  kbl:{name:'KBL',short:'KBL',level:68,games:54,mult:1,kind:'pro',minSal:4000,salK:220,exp:1.7,maxSal:120000},
  sangmu:{name:'KBL · 상무',short:'KBL',level:68,games:54,mult:.8,kind:'pro'},
  bleague:{name:'일본 B.리그',short:'B.리그',level:71,games:60,mult:1,kind:'pro',minSal:7000,salK:300,exp:1.7,maxSal:150000},
  gleague:{name:'NBA G리그',short:'G리그',level:72,games:50,mult:.5,kind:'pro',minSal:5000,salK:60,exp:1.5,maxSal:15000},
  nba:{name:'NBA',short:'NBA',level:80,games:82,mult:2.2,kind:'pro',minSal:160000,salK:10500,exp:1.9,maxSal:8000000,bonus:8},
  wkbl:{name:'WKBL',short:'WKBL',level:64,games:30,mult:.85,kind:'pro',minSal:3000,salK:120,exp:1.7,maxSal:35000},
  wleague:{name:'일본 W리그',short:'W리그',level:67,games:28,mult:.8,kind:'pro',minSal:4000,salK:130,exp:1.7,maxSal:40000},
  wnba:{name:'WNBA',short:'WNBA',level:76,games:40,mult:1.8,kind:'pro',minSal:9000,salK:250,exp:1.8,maxSal:40000},
};
const PTS_TOP={elem:15,middle:18,high:21,uleague:20,ncaa:19,kbl:20,sangmu:19,bleague:21,gleague:22,nba:27,wkbl:18,wleague:17,wnba:21};
const FAME_M={elem:.15,middle:.25,high:.5,uleague:.7,ncaa:1,kbl:1,sangmu:.7,bleague:.9,gleague:.5,nba:1.8,wkbl:.9,wleague:.8,wnba:1.4};
const TEAMS={
  kbl:['서울 썬더스','부산 하버호크스','울산 웨일즈','원주 마운틴스','안양 레드폭스','창원 세일러스','수원 블레이저스','대구 오렌지크루','고양 피닉스','인천 스톰'],
  wkbl:['아산 위너스','용인 블루윙스','청주 스카이','부천 선라이즈','인천 마린스','서울 블라썸'],
  bleague:['도쿄 라이징선','오사카 드래곤즈','치바 윈드','류큐 웨이브','우츠노미야 브레이브','나고야 다이아몬즈'],
  wleague:['도쿄 사쿠라','나고야 스타즈','후쿠오카 블룸','삿포로 스노우'],
  gleague:['샌디에이고 웨이브러너스','오클라호마 블루스톰','솔트레이크 하이랜더스','메인 랍스터스','텍사스 레전드리'],
  nba:['LA 스타라이너스','뉴욕 나이트호크스','시카고 블리자드','보스턴 하버맨','샌프란시스코 골드러시','마이애미 플라밍고스','댈러스 론스타스','덴버 서밋','밀워키 노스우즈','피닉스 선버스트','토론토 오로라','멤피스 리버보츠'],
  wnba:['뉴욕 스카이라인','LA 선셋','시애틀 레이니어','라스베이거스 하이롤러스','시카고 레이크쇼어','애틀랜타 피치스'],
  ncaa:['노스필드 대학','켄터키 주립대','캔자스 플레인즈대','오클랜드 주립대','미시간 테크','텍사스 웨스턴대','조지타운 레이크대'],
  uleague:['한강대','서라벌대','태백대','동해대','금강대','한성체대','백두대','청운대'],
};
const SCH=['한빛','새솔','청람','다온','가람','누리','해밀','미르','라온','도담','온누리','은빛','푸른솔','태양','한울'];
const SUR=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','류','홍'];
const GM=['민준','서준','도윤','예준','시우','하준','주원','지호','지후','준우','현우','건우','우진','선우','유찬','은찬','태윤','승현','재윤','도현'];
const GF=['서연','서윤','지우','하은','하윤','민서','지유','윤서','채원','수아','지민','예은','다은','소율','가은','예린','수빈','나연','시은','유진'];
const koName=g=>pick(SUR)+pick(g==='f'?GF:g==='m'?GM:(chance(.5)?GM:GF));
const TRAITS={
  family:{ko:'농구 집안',desc:'부모님 모두 선수 출신. 기본기와 농구 IQ가 높게 시작한다.'},
  iron:{ko:'강철 체력',desc:'부상 확률이 크게 낮고 체력 한계가 높다.'},
  glass:{ko:'유리몸',desc:'잠재력은 높지만 부상이 잦다.',neg:1},
  grinder:{ko:'노력파',desc:'훈련 효과 +30%.'},
  genius:{ko:'천재',desc:'잠재력이 높고 자연 성장이 빠르다.'},
  shooter:{ko:'슈터 DNA',desc:'슈팅 한계치 +8.'},
  bounce:{ko:'타고난 탄력',desc:'운동능력 한계치 +8.'},
  clutch:{ko:'강심장',desc:'클러치 상황 성공률 +12%p.'},
  showman:{ko:'쇼맨십',desc:'인기 상승 1.5배.'},
  fragile:{ko:'여린 멘탈',desc:'멘탈이 쉽게 흔들린다. 대신 감각이 예민해 잠재력 +3.',neg:1},
  tall:{ko:'장신 유전자',desc:'예상 신장 +6cm.'},
  rich:{ko:'금수저',desc:'가족 지원 예산이 넉넉하고 5,000만 원을 들고 성인이 된다.'},
  lazy:{ko:'게으른 천재',desc:'잠재력 +6, 훈련 효과 -25%.',neg:1},
};
const CONFLICT=[['iron','glass'],['clutch','fragile'],['grinder','lazy'],['genius','lazy']];
const STAGE_KO={elem:'초등학교 농구부',middle:'중학교 농구부',high:'고등학교 농구부',college:'대학 선수',pro:'프로 선수',army:'군 복무 중',retired:'은퇴',civil:'일반인'};
const AP_BY={elem:3,middle:4,high:4,college:4,pro:5,army:2,retired:3,civil:3};
const GFRAC={8:.69,9:.72,10:.75,11:.785,12:.82,13:.865,14:.91,15:.95,16:.975,17:.99,18:.997};
const gfrac=a=>a>=19?1:(GFRAC[a]||.69);

/* ================= state helpers ================= */
let S=null;
const UI={tab:'feed',modalOpen:false,draft:null,confirmRetire:false};
const has=(s,t)=>s.traits.includes(t);
const posBase=s=>POS[s.pos].h-(s.gender==='f'?13:0);
const domPro=s=>s.gender==='m'?'kbl':'wkbl';
const topPro=s=>s.gender==='m'?'nba':'wnba';
function cap(s,k){
  const w=POS[s.pos].w[k]??0.1;
  let c=s.pot+(k==='stamina'?3:(w-0.11)*45);
  if(k==='shoot'&&has(s,'shooter'))c+=8;
  if(k==='athletic'&&has(s,'bounce'))c+=8;
  if(k==='stamina'&&has(s,'iron'))c+=8;
  if(k==='iq'&&has(s,'family'))c+=5;
  return clamp(Math.round(c),25,99);
}
function ovr(s){
  const P=POS[s.pos];let o=0;
  for(const k in P.w)o+=s.attr[k]*P.w[k];
  const hb=clamp((s.height-posBase(s)*gfrac(s.age))*0.32,-9,5);
  return clamp(Math.round(o+hb),1,99);
}
const potStars=p=>clamp(Math.round((p-45)/10),1,5);
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function lf(s,k,d){
  if(k==='fame'&&d>0&&has(s,'showman'))d*=1.5;
  if(k==='mental'&&d<0&&has(s,'fragile'))d*=1.4;
  s.life[k]=clamp(s.life[k]+d,0,100);
}
function at(s,k,d){s.attr[k]=clamp(s.attr[k]+d,1,99);}
function tr(s,k,base){
  const c=cap(s,k),v=s.attr[k];
  const room=clamp((c-v)/20,0.05,1.3);
  const am=s.age<13?.85:s.age<23?1.15:s.age<28?.85:s.age<32?.5:.3;
  let g=base*room*am*R(.75,1.25);
  if(has(s,'grinder'))g*=1.3;
  if(has(s,'lazy'))g*=.75;
  if(s.life.health<30)g*=.7;
  s.attr[k]=Math.min(99,v+g);
  return g;
}
function boostAll(s,d){for(const k of ATTRS)at(s,k,d*R(.6,1.25));}
function addRel(s,type,name,bond,age){
  s.flags.rid=(s.flags.rid||0)+1;
  const r={id:s.flags.rid,type,name,bond:clamp(bond,0,100),age:age??s.age};
  s.relations.push(r);return r;
}
const partner=s=>s.relations.find(r=>!r.dead&&(r.type==='연인'||r.type==='배우자'));
const parents=s=>s.relations.filter(r=>!r.dead&&(r.type==='아버지'||r.type==='어머니'));
function log(s,text,tone=''){
  s.log.push({age:s.age,year:s.year,text,tone});
  if(s.log.length>600)s.log.splice(0,s.log.length-600);
}
const isPlaying=s=>['elem','middle','high','college','pro'].includes(s.stage)&&!!s.team;
const lvl=s=>s.team?LG[s.team.league].level:LG[domPro(s)].level;
function roleLabel(o,str){const d=o-str;return d>=8?'에이스':d>=2?'주전':d>=-4?'로테이션':'벤치 멤버';}
function teamStars(str,lg){return clamp(Math.round((str-LG[lg].level+10)/4),1,5);}
function famBudget(s){return s.flags.famBudget??0;}
function spend(s,amt){ // returns false if unaffordable
  if(s.age<19){ if(famBudget(s)<amt)return false; s.flags.famBudget-=amt; return true; }
  if(s.money<amt)return false; s.money-=amt; return true;
}
const wallet=s=>s.age<19?famBudget(s):s.money;
function salaryFor(s,lg){
  const L=LG[lg],o=ovr(s);
  const rel=Math.max(0,o-L.level+(L.bonus||6));
  let sal=L.minSal+Math.pow(rel,L.exp)*L.salK+s.life.fame*L.minSal*.01;
  if(s.flags.agent)sal*=1.15;
  return clamp(sal,L.minSal,L.maxSal);
}

/* ================= new game ================= */
function rollGenetics(g){
  const keys=Object.keys(TRAITS),tr=[];
  while(tr.length<2){
    const k=pick(keys);
    if(tr.includes(k))continue;
    if(CONFLICT.some(([a,b])=>(a===k&&tr.includes(b))||(b===k&&tr.includes(a))))continue;
    tr.push(k);
  }
  let pot=Math.round(gauss(70,9));
  if(tr.includes('genius'))pot+=7;
  if(tr.includes('glass'))pot+=5;
  if(tr.includes('fragile'))pot+=3;
  if(tr.includes('lazy'))pot+=6;
  pot=clamp(pot,45,97);
  const h=gauss(g==='f'?175:188,6.5)+(tr.includes('tall')?6:0);
  return {traits:tr,pot,adultHeight:Math.round(h*10)/10};
}
function schoolTeam(stage,tier='mid'){
  const L=LG[stage];
  const suf={elem:'초',middle:'중',high:'고'}[stage];
  const off=tier==='top'?R(7,11):tier==='mid'?R(-2,3):R(-9,-5);
  return {name:pick(SCH)+suf,league:stage,str:Math.round(L.level+off)};
}
function newGame(o){
  const g=o.gen;
  const s={v:1,name:o.name,gender:o.gender,pos:o.pos,number:o.number,traits:g.traits,pot:g.pot,adultHeight:g.adultHeight,
    age:8,year:START_YEAR,alive:true,height:0,attr:{},life:{happy:74,health:90,mental:60,fame:0,smarts:50},money:0,
    stage:'elem',team:null,contract:null,ap:3,apMax:3,seasons:[],awards:[],relations:[],assets:[],log:[],
    flags:{used:{},played:{},relDone:{},famBudget:0},legacy:0,injury:null,ovrHist:[],career2:null,invest:0,retiredAge:null};
  s.height=+(s.adultHeight*gfrac(8)).toFixed(1);
  for(const k of ATTRS)s.attr[k]=12+R(0,7)+(POS[s.pos].w[k]||.1)*24;

  addRel(s,'아버지',dad,RI(60,85),RI(36,44));
  addRel(s,'어머니',mom,RI(65,90),RI(34,42));
  if(chance(.5))addRel(s,pick(['형제','자매']),koName(),RI(45,75),8+pick([-3,-2,2,3]));
  s.ovrHist.push({age:8,o:ovr(s)});

  if(has(s,'family'))log(s,'거실 벽에는 부모님의 선수 시절 사진이 걸려 있다.');
  return s;
}

function actAvailable(s,a){
  if(a.play&&!isPlaying(s))return false;
  if(a.stages&&!a.stages.includes(s.stage))return false;
  if(a.minAge&&s.age<a.minAge)return false;
  if(a.maxAge&&s.age>a.maxAge)return false;
  if(a.cond&&!a.cond(s))return false;
  return true;
}

function endorseAmt(s){const top=s.team&&LG[s.team.league].mult>=2;return Math.round((s.life.fame*s.life.fame*(top?8:1.6))/100)*100+1000;}
function eligible(s,e){
  if(e.once&&s.flags.used[e.id])return false;
  if(e.age&&(s.age<e.age[0]||s.age>e.age[1]))return false;
  if(e.stages&&!e.stages.includes(s.stage))return false;
  if(e.cond&&!e.cond(s))return false;
  return true;
}
function pickEvents(s,n){
  const pool=EVENTS.filter(e=>eligible(s,e)&&!(s.flags.recent||[]).includes(e.id));const out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((a,e)=>a+e.w,0);let r=rnd()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break;}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  s.flags.recent=[...(s.flags.recent||[]),...out.map(e=>e.id)].slice(-6);
  return out;
}
function eventSpec(s,e){
  if(!eligible(s,e))return null;
  if(e.pre)e.pre(s);
  s.flags.used[e.id]=1;
  return {kicker:`${s.age}세 · ${s.year}`,title:e.title,body:`<p>${typeof e.body==='function'?e.body(s):e.body}</p>`,
    choices:e.choices.filter(c=>!c.cond||c.cond(s)).map(c=>({label:c.t,sub:c.sub,act:()=>c.f(s)}))};
}

/* ================= season simulation ================= */
function simSeason(s){
  const lg=s.team.league,L=LG[lg],lv=L.level,o=ovr(s),rel=o-lv,A=s.attr;
  let gpFrac=1,injury=null;
  if(s.injury){gpFrac-=s.injury.carry;injury={name:s.injury.name+' (재활)',sev:0};s.injury=null;}
  let p=.06+(s.life.health<45?.08:0)+(s.life.health<25?.12:0)+(has(s,'glass')?.09:0)-(has(s,'iron')?.04:0)+(s.age>=31?.04:0)+(s.age>=34?.05:0)-(s.flags.loadMgmt?.04:0);
  if(gpFrac>.3&&chance(p)){
    const r=rnd();let inj;
    if(r<.55)inj={name:pick(['발목 염좌','손가락 탈구','허벅지 타박상','허리 근육 경련']),frac:R(.05,.15),sev:1};
    else if(r<.88)inj={name:pick(['햄스트링 부분 파열','발목 인대 손상','무릎 연골 손상','손목 골절']),frac:R(.2,.4),sev:2};
    else inj={name:pick(['전방십자인대 파열','아킬레스건 파열','발등 피로골절']),frac:R(.5,.85),sev:3};
    gpFrac-=inj.frac;
    if(inj.sev===3){at(s,'athletic',-R(3,6));at(s,'stamina',-R(1,3));s.injury={name:inj.name,carry:R(.2,.45)};lf(s,'mental',-10);}
    else if(inj.sev===2){at(s,'athletic',-R(0,1.5));lf(s,'mental',-4);}
    lf(s,'health',-inj.sev*8);
    injury=inj;
  }
  gpFrac=clamp(gpFrac,0,1);
  const games=L.games,gp=Math.round(games*gpFrac*R(.93,1));
  const depth=Math.max(0,s.team.str-o);
  let min=clamp(21+rel*1.3+(A.stamina-lv)*.1-depth*.7-(s.flags.loadMgmt?4:0),3,37.5);
  if(s.contract?.practice)min=Math.min(min,12);
  const m=min/36,vary=()=>R(.88,1.12);
  const scor=A.shoot*.45+A.inside*.35+A.athletic*.2-lv;
  const hRel=s.height-(s.gender==='f'?178:193)*gfrac(s.age);
  const pts=gp?m*clamp(11.5+scor*.62,1.5,44)*vary():0;
  const reb=gp?m*clamp(3.2+(A.rebound-lv)*.2+hRel*.13,.6,16)*vary():0;
  const ast=gp?m*clamp(1.8+(A.pass-lv)*.12+(A.handle-lv)*.05+{PG:2.6,SG:1,SF:.6,PF:.2,C:0}[s.pos],.3,12.5)*vary():0;
  const tp=clamp(.25+(A.shoot-lv)*.005+A.shoot*.0008+R(-.02,.02),.1,.47);
  const fg=clamp(.41+(A.inside-lv)*.0025+(['PF','C'].includes(s.pos)?.05:0)+(A.iq-lv)*.0012+R(-.02,.02),.32,.66);
  const impact=rel*m*.012*(gp/games)+(s.flags.clutchBoost||0);
  const wp=clamp(.5+(s.team.str-lv)*.03+impact,.06,.94);
  const wins=Math.round(games*clamp(wp+R(-.05,.05),.03,.97)),pct=wins/games;
  const school=L.kind!=='pro';
  const labels=school?['전국대회 우승','준우승','4강','8강','예선 탈락']:lg==='nba'||lg==='wnba'?['파이널 우승','파이널 준우승','컨퍼런스 결승','플레이오프 진출','플레이오프 탈락']:['챔피언결정전 우승','챔피언결정전 준우승','4강 플레이오프','6강 플레이오프','플레이오프 탈락'];
  let res=4;
  if(pct>=(school?.45:.5)){const tc=clamp((pct-.48)*1.9+(rel>10&&gpFrac>.6?.08:0),.02,.75);const r=rnd();res=r<tc?0:r<tc+.17?1:r<tc+.42?2:3;}
  const champ=res===0;
  // awards
  const aw=[],AWL={mvp:20,fmvp:12,champ:10,allstar:3,scoring:5,dpoy:4,roy:5};
  const sh=L.short,played=gp>=games*.5,isPro=L.kind==='pro';
  if(played&&rel>=12&&pct>=.55&&chance(clamp(.25+(rel-12)*.07+(pct-.55),0,.92)))aw.push(['mvp',`${sh} MVP`]);
  if(champ&&played&&rel>=6&&isPro&&chance(.7))aw.push(['fmvp',`${sh} 파이널 MVP`]);
  if(played&&rel>=6&&chance(clamp(.3+(rel-6)*.1,0,.97)))aw.push(['allstar',isPro?`${sh} 올스타`:`${sh} 베스트5`]);
  if(played&&pts>=PTS_TOP[lg]&&chance(.6))aw.push(['scoring',`${sh} 득점왕`]);
  if(played&&A.defense-lv>=12&&chance(.45))aw.push(['dpoy',`${sh} 수비상`]);
  if(isPro&&lg!=='sangmu'&&!s.flags.played[lg]&&played&&rel>=0&&chance(clamp(.35+rel*.06,0,.9)))aw.push(['roy',`${sh} 신인왕`]);
  if(champ)aw.push(['champ',school?`${sh} 우승`:`${sh} 우승`]);
  s.flags.played[lg]=true;
  // effects
  const fm=FAME_M[lg]||1;
  let fame=(Math.max(0,rel)*.22+pts*.12)*fm;
  aw.forEach(([k])=>fame+=({mvp:8,fmvp:5,champ:4,allstar:2,scoring:2,dpoy:1.5,roy:3}[k]||0)*fm);
  lf(s,'fame',fame);
  if(champ)lf(s,'mental',8),lf(s,'happy',10);
  if(aw.some(a=>a[0]==='mvp'))lf(s,'mental',6);
  if(rel<-5&&isPro)lf(s,'mental',-6),lf(s,'happy',-4);
  if(min<10&&isPro)lf(s,'happy',-5);
  let legacy=(pts+reb*.7+ast*.9)*(gp/games)*L.mult*.5;
  aw.forEach(([k])=>legacy+=(AWL[k]||0)*L.mult);
  s.legacy+=legacy;
  let paid=0;
  if(s.contract){paid=s.contract.salary;s.money+=Math.round(paid*(s.flags.agent?.92:1));s.contract.years--;}
  s.flags.lastRel=rel;s.flags.clutchBoost=0;s.flags.loadMgmt=false;
  const season={year:s.year,age:s.age,team:s.team.name,lg,gp,games,min:+min.toFixed(1),pts:+pts.toFixed(1),reb:+reb.toFixed(1),ast:+ast.toFixed(1),tp:+(tp*100).toFixed(1),fg:+(fg*100).toFixed(1),
    w:wins,l:games-wins,res:labels[res],champ,awards:aw.map(a=>a[1]),akeys:aw.map(a=>a[0]),ovr:o,injury:injury?.name||null,salary:paid};
  s.seasons.push(season);
  aw.forEach(a=>s.awards.push({year:s.year,age:s.age,key:a[0],name:a[1],lg}));
  const line=`${s.team.name} · ${wins}승 ${games-wins}패 · ${labels[res]} · 평균 ${season.pts}점 ${season.reb}리바 ${season.ast}어시`;
  log(s,line,champ?'major':res>=4?'':'good');
  aw.filter(a=>a[0]!=='champ').forEach(a=>log(s,`${a[1]} 수상`,'major'));
  if(injury&&injury.sev)log(s,`부상: ${injury.name}`,'bad');
  return season;
}

    {t:'오픈 동료에게 킥아웃',sub:'더블팀을 끌어내고 빼 준다',p:.36+((A.pass+A.iq)/2-lv)*.01+cb*.5,kind:'pass'},

    choices:opts.map(o=>({label:o.t,sub:o.sub,tag:`${Math.round(o.p*100)}%`,act:()=>chance(o.p)?ctx.win(s,o):ctx.lose(s,o)}))};

/* ================= year flow ================= */
let queue=[];
function enqueue(fn){queue.push(fn);}
function ageUp(quiet){
  if(UI.modalOpen||!S||!S.alive)return;
  const s=S;queue=[];
  const yr=s.year;
  if(!quiet){
    const n=s.stage==='pro'?(chance(.55)?2:1):s.age<12?(chance(.6)?1:0):(chance(.3)?2:1);
    pickEvents(s,n).forEach(e=>enqueue(()=>eventSpec(s,e)));
  }
  if(isPlaying(s)&&!s.flags.banned){
    if(!quiet&&s.age>=11&&chance(.42))enqueue(()=>isPlaying(s)?seasonClutch(s):null);
    enqueue(()=>isPlaying(s)?seasonSpec(s):null);
  }
  enqueue(()=>{yearEnd(s,yr);return null;});
  nextModal();
}
function yearEnd(s,yr){
  const o0=ovr(s);
  // national team status (evaluated on finished season)
  const cut=s.gender==='m'?71:65;
  if(s.age>=19&&['college','pro'].includes(s.stage)&&o0>=cut&&!s.flags.banned){if(!s.flags.nat){s.flags.nat=true;lf(s,'fame',5);log(s,'성인 국가대표에 처음 발탁됐다.','major');}}
  else if(s.flags.nat&&(o0<cut-3||!isPlaying(s)))s.flags.nat=false;
  nationalSpecs(s,yr).forEach(f=>enqueue(f));
  // age
  s.age++;s.year++;
  const prevH=s.height;
  s.height=+Math.max(s.height,s.adultHeight*gfrac(s.age)).toFixed(1);
  if(s.age<=19&&s.height-prevH>=4)log(s,`키가 ${(s.height-prevH).toFixed(1)}cm 컸다. 이제 ${s.height.toFixed(1)}cm.`,'good');
  // natural development
  const a=s.age;
  for(const k of ATTRS){
    const c=cap(s,k),v=s.attr[k];let d=0;
    if(v<c){d=(c-v)*(a<13?.05:a<19?.07:a<23?.05:a<28?.022:0);if(has(s,'genius'))d*=1.3;}
    if(a>=30){const dec={athletic:1.6,stamina:1.3,inside:.6,rebound:.7,defense:.8,handle:.5,shoot:.2,pass:.1,iq:-.4}[k]*(1+(a-30)*.18);d-=dec*R(.6,1.3);}
    if(s.stage==='army')d-=R(1,2.5);
    s.attr[k]=clamp(v+d*R(.7,1.25),1,99);
  }
  // life drift
  const maxH=clamp(100-Math.max(0,a-40)*.9,20,100);
  s.life.health=clamp(s.life.health+(a<30?14:a<50?8:a<70?3:0),0,maxH);
  if(a>=60)s.life.health=clamp(s.life.health-R(1,4)*(1+(a-60)/15),0,100);
  s.life.happy+=(58-s.life.happy)*.15;
  s.life.mental+=(55-s.life.mental)*.1;
  s.life.fame*=isPlaying(s)?.93:.9;
  if(s.age<23&&isPlaying(s)&&s.stage!=='pro')s.life.smarts=clamp(s.life.smarts-1,0,100);
  // money
  if(s.age===19&&!s.flags.gotSeed){s.flags.gotSeed=1;if(has(s,'rich')){s.money+=5000;log(s,'성인이 되자 부모님이 통장을 건네주셨다. 5,000만 원.');}}
  if(s.age<19)s.flags.famBudget=Math.min((s.flags.famBudget||0)+(has(s,'rich')?3000:600),has(s,'rich')?9000:1500);
  if(s.age>=20){const living=Math.round(1500+Math.max(0,s.contract?.salary||s.career2?.income||0)*.12);s.money-=living;}
  if(s.flags.endorse){if(s.life.fame<25||s.stage!=='pro'){log(s,'광고 계약이 종료됐다.');s.flags.endorse=0;}else{s.money+=s.flags.endorse;}}
  if(s.invest>0){const r=R(-.35,.5);const back=Math.round(s.invest*(1+r));s.money+=back;log(s,`투자 정산: ${fmtMoney(s.invest)} → ${fmtMoney(back)} (${r>=0?'+':''}${Math.round(r*100)}%)`,r>=0?'good':'bad');s.invest=0;}
  s.assets.forEach(x=>{if(x.grow)x.value=Math.round(x.value*(1+R(-.02,x.grow)));if(x.upkeep)s.money-=x.upkeep;});
  if((s.stage==='retired'||s.stage==='civil')&&s.career2&&a<66){
    let inc=s.career2.income;if(s.career2.risky)inc=Math.round(inc*R(.3,1.8));
    if(s.career2.id==='creator')s.career2.income=Math.round(Math.max(1500,s.life.fame*s.life.fame*2));
    s.money+=inc;
    if(s.flags.headCoach&&chance(clamp((s.attr.iq-55)*.012+.06,.03,.3))){s.awards.push({year:s.year-1,age:a-1,key:'coach_champ',name:`${s.year-1} 감독 우승`,lg:'coach'});s.legacy+=8;lf(s,'fame',6);lf(s,'happy',10);log(s,'감독으로서 챔피언결정전 우승을 차지했다!','major');}
  }
  if(a===66&&s.career2){log(s,'일에서 은퇴했다. 이제는 쉬어도 된다.');}
  if(a>=66)s.money+=Math.round(1200+(s.flags.pensionBonus||0));
  // relations
  s.flags.relDone={};
  s.relations.forEach(r=>{if(r.dead)return;r.age++;r.bond=clamp(r.bond-(r.type==='라이벌'?1:2),0,100);
    if(r.type==='아버지'||r.type==='어머니'){if(r.age>=68&&chance(.012*Math.exp((r.age-68)/6))){r.dead=true;lf(s,'happy',-22);lf(s,'mental',-10);log(s,`${r.type} ${J(r.name,'이/가')} 세상을 떠나셨다. 향년 ${r.age}세.`,'bad');}}
    if(r.type==='연인'&&r.bond<25&&chance(.45)){r.dead=true;r.gone=true;lf(s,'happy',-10);log(s,`${J(r.name,'과/와')} 헤어졌다.`,'bad');}
  });
  s.relations=s.relations.filter(r=>!(r.gone));
  // injuries carry handled in sim; growth spurts
  s.ovrHist.push({age:a,o:ovr(s)});
  // stage AP
  s.apMax=AP_BY[s.stage]||3;s.ap=s.apMax;s.flags.yearly={};
  if(s.life.happy<15&&!s.flags.lowWarned){s.flags.lowWarned=1;log(s,'요즘 아무것도 즐겁지 않다. 쉬어야 할 때다.','bad');}
  if(s.life.happy>30)s.flags.lowWarned=0;
  // banned
  if(s.flags.banned&&s.stage==='pro'){retire(s);enqueue(()=>career2Spec(s,false));}
  // transitions
  transitions(s);
  // HOF
  if(s.stage==='retired'&&!s.flags.hof&&s.retiredAge&&a-s.retiredAge>=4&&s.legacy>=150){
    enqueue(()=>{s.flags.hof=true;lf(s,'fame',15);lf(s,'happy',15);log(s,'농구 명예의 전당에 헌액됐다.','major');
      return {kicker:`${s.year} 명예의 전당`,title:'명예의 전당 헌액',body:`<p>무대 위, 내 이름이 새겨진 동판이 걸렸다. 객석 맨 앞줄에 ${s.relations.some(r=>r.type==='배우자'&&!r.dead)?'가족들이':'옛 동료들이'} 앉아 있었다.</p>`,choices:[{label:'소감을 말한다',primary:true,act:()=>'"농구공 하나로 여기까지 왔습니다."'}]};});
  }
  // death
  if(a>=45){
    let p=.0015*Math.exp((a-45)/8.5);
    if(s.life.health<25)p*=3;if(s.life.health<10)p*=3;
    if(a>=104||chance(p))enqueue(()=>deathSpec(s));
  }
  if(s.life.health<=0&&a<45&&chance(.3))enqueue(()=>deathSpec(s));
}
function transitions(s){
  const a=s.age;
  if(s.stage==='elem'&&a===13){enqueue(()=>schoolChoiceSpec(s,'middle'));return;}
  if(s.stage==='middle'&&a===16){enqueue(()=>schoolChoiceSpec(s,'high'));return;}
  if(s.stage==='high'&&a===19){enqueue(()=>crossroadSpec(s));return;}
  if(s.stage==='college'){
    if(a>=23)enqueue(()=>s.stage==='college'?graduateSpec(s):null);
    else if(ovr(s)>=LG[domPro(s)].level-5)enqueue(()=>s.stage==='college'?earlyEntrySpec(s):null);
    return;
  }
  if(s.stage==='army'){enqueue(()=>afterService(s));return;}
  if(s.stage==='pro'&&s.contract){
    if(s.contract.military&&s.contract.years<=0){enqueue(()=>afterService(s));return;}
    const due=s.gender==='m'&&!s.flags.served&&!s.flags.exempt&&!s.contract.military&&(a>=28||s.flags.enlistNext);

const SNAP_LIFE={happy:'행복',health:'건강',mental:'멘탈',fame:'인기',smarts:'학업'};
function snap(s){const o={OVR:ovr(s),'키':s.height};for(const k in SNAP_LIFE)o[SNAP_LIFE[k]]=s.life[k];for(const k of ATTRS)o[ATTR_KO[k]]=s.attr[k];o['돈']=s.money;o['가족 예산']=s.flags.famBudget||0;return o;}
function deltas(a,b){
  const out=[];
  for(const k in a){
    const d=b[k]-a[k];
    if(k==='돈'||k==='가족 예산'){if(Math.abs(d)>=1)out.push(`<i class="${d<0?'neg':''}">${k} ${d>0?'+':'-'}${fmtMoney(Math.abs(d))}</i>`);continue;}
    const r=Math.round(d);
    if(r!==0)out.push(`<i class="${r<0?'neg':''}">${k} ${r>0?'+':''}${r}</i>`);
  }
  return out.length?`<div class="deltas">${out.join('')}</div>`:'';
}
function nextModal(){
  while(queue.length){

  }

}
function showModal(spec){
  UI.modalOpen=true;

  const box=$('#mChoices');box.innerHTML='';
  spec.choices.forEach(c=>{
    const b=document.createElement('button');

    b.disabled=!!c.disabled;
    if(c.primary)b.textContent=c.label;
    else b.innerHTML=`<span class="c-main"><strong>${c.html?c.label:esc(c.label)}</strong>${c.disabled&&c.reason?`<small>${esc(c.reason)}</small>`:c.sub?`<small>${esc(c.sub)}</small>`:''}</span>${c.tag?`<span class="c-tag">${esc(c.tag)}</span>`:''}`;
    b.onclick=()=>{
      const before=snap(S);
      let r;try{r=c.act();}catch(e){console.error(e);r=null;}
      const d=deltas(before,snap(S));
      render();

      if(typeof r==='string'){
        log(S,`${spec.title}: ${r}`);
        resultView(spec,r,d,null);return;
      }
      if(r.spec){showModal(r.spec);return;}

      nextModal();

function sparkSVG(s){
  const pts=s.ovrHist;if(pts.length<2)return '<div class="empty">한 해가 지나면 그래프가 그려진다.</div>';
  const W=600,H=120,pl=28,pr=10,pt=10,pb=20;
  const a0=pts[0].age,a1=pts[pts.length-1].age;
  const x=a=>pl+(a-a0)/Math.max(1,a1-a0)*(W-pl-pr),y=v=>pt+(1-v/100)*(H-pt-pb);
  const line=pts.map(p=>`${x(p.age).toFixed(1)},${y(p.o).toFixed(1)}`).join(' ');
  const area=`${x(a0)},${y(0)} ${line} ${x(a1)},${y(0)}`;
  const peak=pts.reduce((m,p)=>p.o>m.o?p:m,pts[0]);
  const ticks=[0,25,50,75,100];
  const lvLines=s.gender==='m'?[['KBL',68],['NBA',80]]:[['WKBL',64],['WNBA',76]];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="나이별 종합 능력치">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#284069" stroke-width="1" stroke-dasharray="${t?'2 4':''}"/><text x="${pl-6}" y="${y(t)+4}" fill="#60739a" font-size="10" text-anchor="end">${t}</text>`).join('')}
    ${lvLines.map(([n,v])=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ffc443" stroke-opacity=".35" stroke-width="1"/><text x="${W-pr-2}" y="${y(v)-3}" fill="#ffc443" fill-opacity=".7" font-size="10" text-anchor="end">${n} 주전</text>`).join('')}
    <polygon points="${area}" fill="#ef6620" fill-opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="#ff8c47" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(peak.age)}" cy="${y(peak.o)}" r="3.5" fill="#ffc443"/>
    <text x="${x(a0)}" y="${H-5}" fill="#60739a" font-size="10">${a0}세</text><text x="${x(a1)}" y="${H-5}" fill="#60739a" font-size="10" text-anchor="end">${a1}세</text>
  </svg><div class="sb-note" style="margin-top:4px">최고점 ${peak.o} (${peak.age}세)</div>`;
}

    <div class="end-hero">
      <div class="grade">${g}</div>
      <h1>${esc(s.name)}</h1>
      <div class="life num">${START_YEAR-8} – ${s.deathYear||s.year} · 향년 ${s.age}세 · #${s.number} ${s.pos}</div>
      <div class="title">${t}</div>
      <p class="epitaph">${esc(ep)}</p>
    </div>
    <div class="panel"><h3>커리어 요약</h3><div class="kv">
      <div><span>프로 시즌</span><b class="num">${pro.length}</b></div>
      <div><span>프로 통산 득점</span><b class="num">${tot('pts').toLocaleString('ko-KR')}</b></div>
      <div><span>평균 기록</span><b>${gp?`${(tot('pts')/gp).toFixed(1)}점 ${(tot('reb')/gp).toFixed(1)}리바 ${(tot('ast')/gp).toFixed(1)}어시`:'—'}</b></div>
      <div><span>우승 (전체 / 프로)</span><b class="num">${champs} / ${proChamps}</b></div>
      <div><span>MVP · 올스타</span><b class="num">${mvps} · ${alls}</b></div>
      <div><span>레거시 점수</span><b class="num">${Math.round(s.legacy)}</b></div>
      <div><span>최종 자산</span><b class="num">${fmtMoney(s.money+s.assets.reduce((a,x)=>a+(x.value||0),0))}</b></div>
      <div><span>최고 능력치</span><b class="num">${Math.max(...s.ovrHist.map(p=>p.o))}</b></div>
    </div></div>
    <div class="panel"><h3>결정적 순간들</h3><div class="feed">${majors.map(e=>`<div class="yr"><div class="yr-age num">${e.age}세<small>${e.year}</small></div><ul><li class="major">${esc(e.text)}</li></ul></div>`).join('')}</div></div>
    <button class="cta" id="btnAgain">새 인생 시작</button>
  </div></div>`;
}
function bindEnd(){$('#btnAgain').onclick=()=>{S=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}render();};}

/* ================= persistence ================= */
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){S=JSON.parse(raw);UI.tab=localStorage.getItem(SAVE_KEY+':tab')||'feed';}}catch(e){S=null;}}

function start(data){
  if(data&&data.S)S=data.S;
  render();
  if(S&&S.alive&&data&&data.pending){/* modal state is not restorable mid-choice; continue normally */}
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
